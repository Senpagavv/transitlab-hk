<!doctype html>
<html lang="zh-Hant" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TransitLab HK · 關卡編輯器</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>/* v2.1 · design language follows the team product suite (TransitLab-產品套件):
   paper + ink, Bodoni Moda / Geist / Geist Mono, dotted paper, hairline frames,
   colour only where it means something — green = good (delivered), red→amber = loss. */
:root{
  --s-paper:#FFFCF7; --s-panel:#FFFFFF; --s-soft:#F8F6F1; --s-raise:#F1EEE7;
  --s-ink:#0A0A0A; --s-ink2:#525252; --s-ink3:#8C8C8C;
  --s-line:rgba(0,0,0,.08); --s-line2:rgba(0,0,0,.18); --s-grid:rgba(0,0,0,.05);
  --s-accent:#0E7A4E; --s-accent2:#12A06A; --s-accent-soft:#E6F1EA; --s-on-accent:#FFFCF7;
  --s-good:#0E7A4E; --s-warn:#B07C10; --s-bad:#BF3B2B; --s-bad-soft:#FBEDEA; --s-info:#1F5FA8;
  --s-road:#EEEAE1; --s-road-edge:rgba(0,0,0,.10);
  --s-chrome:rgba(255,252,247,.84); --s-shadow:0 12px 30px rgba(0,0,0,.09);
  --s-top:56px; --s-nav:78px; --s-stop:30px; --s-navpad:11px; --s-stop-fs:12px;
  --s-display:'Bodoni Moda','MTR Song','地鐵宋','Chiron Sung HK','Noto Serif TC','Songti TC','Songti SC',serif;
  --s-serif-tc:'Noto Serif TC','Chiron Sung HK','Songti TC','PingFang HK',serif;
  --s-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --s-paper:#0A0A0A; --s-panel:#111111; --s-soft:#161616; --s-raise:#1C1C1C;
  --s-ink:#F5F5F5; --s-ink2:#A3A3A3; --s-ink3:#8C8C8C;
  --s-line:rgba(255,255,255,.08); --s-line2:rgba(255,255,255,.20); --s-grid:rgba(255,255,255,.06);
  --s-accent:#4EBE84; --s-accent2:#6FD39D; --s-accent-soft:#12291F; --s-on-accent:#0A0A0A;
  --s-good:#4EBE84; --s-warn:#E89D4A; --s-bad:#D96B4A; --s-bad-soft:#2A1512; --s-info:#7BA7E8;
  --s-road:#202020; --s-road-edge:rgba(255,255,255,.08);
  --s-chrome:rgba(10,10,10,.78); --s-shadow:0 12px 34px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--s-paper);color:var(--s-ink);display:flex;flex-direction:column;overflow:hidden;
  font-family:'Geist',system-ui,-apple-system,'PingFang HK','PingFang TC','Microsoft JhengHei',sans-serif;
  font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(var(--s-grid) 1px,transparent 1px);background-size:10px 10px}
button{font:inherit;color:inherit}
.mono{font-family:var(--s-mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--s-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--s-ink3)}
.lbl .tc{text-transform:none;letter-spacing:.02em}
.tc{font-size:.9em;color:var(--s-ink2);font-weight:400;letter-spacing:0;margin-left:5px}
.tcb{display:block;color:var(--s-ink2);font-size:13px;letter-spacing:.02em;margin-top:3px;line-height:1.55}
.row{display:flex;align-items:center;gap:10px}.row .sp{flex:1}
.note{color:var(--s-ink2);font-size:13px;line-height:1.62;margin:0}.note b{color:var(--s-ink);font-weight:500}

/* ---- top bar + step nav (the suite's outer frame) ---- */
#topbar{flex:0 0 auto;height:var(--s-top);display:flex;align-items:center;gap:14px;padding:0 14px;
  background:var(--s-chrome);backdrop-filter:blur(25px) saturate(1.4);-webkit-backdrop-filter:blur(25px) saturate(1.4);
  border-bottom:1px solid var(--s-line);z-index:60}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:0 0 auto}
.brandlogo{width:22px;height:22px;image-rendering:pixelated;flex:0 0 auto;display:block}
.brand .wm{font-family:var(--s-display);font-size:20px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.brand .sub{color:var(--s-ink3);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-family:var(--s-mono);white-space:nowrap}
#topbar .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;white-space:nowrap;cursor:pointer;
  border:1px solid var(--s-line);border-radius:4px;background:var(--s-soft);color:var(--s-ink2);
  font-family:var(--s-mono);font-size:10.5px;letter-spacing:.06em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--s-accent);flex:0 0 auto}
.dot.live{animation:bp 2.2s ease-in-out infinite}
@keyframes bp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.82)}}
.btn{appearance:none;border:1px solid var(--s-line2);background:transparent;color:var(--s-ink);height:30px;padding:0 11px;
  border-radius:4px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:12px;
  transition:background .14s,border-color .14s,color .14s,transform .1s}
.btn:hover{border-color:var(--s-ink);background:var(--s-soft)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn-p{background:var(--s-ink);border-color:var(--s-ink);color:var(--s-paper);font-weight:500}
.btn-p:hover{background:var(--s-accent);border-color:var(--s-accent);color:var(--s-on-accent)}
.btn-sm{height:26px;padding:0 9px;font-size:11.5px}
.seg{display:flex;border:1px solid var(--s-line);border-radius:4px;overflow:hidden;flex:0 0 auto}
.seg button{appearance:none;border:0;background:transparent;color:var(--s-ink2);height:28px;padding:0 10px;cursor:pointer;
  display:flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--s-line)}
.seg button[aria-pressed="true"]{background:var(--s-ink);color:var(--s-paper)}
.seg button:hover{color:var(--s-ink)}.seg button[aria-pressed="true"]:hover{color:var(--s-paper)}
button:focus-visible,[role=button]:focus-visible{outline:2px solid var(--s-info);outline-offset:2px}
#navrow{position:relative;flex:0 0 auto;height:var(--s-nav);display:flex;align-items:stretch;
  background:var(--s-chrome);backdrop-filter:blur(25px) saturate(1.4);-webkit-backdrop-filter:blur(25px) saturate(1.4);
  border-bottom:1px solid var(--s-line);z-index:55}
#navrow::before{content:'';position:absolute;left:calc(100%/12);right:calc(100%/12);top:calc(var(--s-navpad) + var(--s-stop)/2 - 1.5px);
  height:3px;border-radius:2px;background:var(--s-line2);pointer-events:none}
#navrow button{appearance:none;border:0;background:transparent;cursor:pointer;min-width:0;flex:1 1 0;display:flex;flex-direction:column;
  align-items:center;gap:5px;padding:var(--s-navpad) 8px 0;position:relative;color:var(--s-ink2)}
#navrow button[disabled]{cursor:default;color:var(--s-ink3)}
#navrow .stop{flex:0 0 auto;min-width:var(--s-stop);height:var(--s-stop);padding:0 9px;border-radius:calc(var(--s-stop)/2);
  border:2px solid var(--s-line2);background:var(--s-panel);color:var(--s-ink2);display:flex;align-items:center;justify-content:center;
  position:relative;z-index:1;font-family:var(--s-mono);font-style:normal;font-size:var(--s-stop-fs);font-weight:500}
#navrow button[aria-selected="true"]{color:var(--s-ink)}
#navrow button[aria-selected="true"] .stop{background:var(--s-ink);border-color:var(--s-ink);color:var(--s-paper)}
#navrow .t{display:flex;flex-direction:column;align-items:center;line-height:1.18;min-width:0;max-width:100%}
#navrow .t b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#navrow button[aria-selected="true"] .t b{font-weight:600}
#navrow .t s{text-decoration:none;font-size:12px;color:var(--s-ink3);letter-spacing:.04em;white-space:nowrap}

/* ---- the game: left column · map plate · right column ---- */
.eg{flex:1;min-height:0;display:flex}
/* the board stays put (the cover's blocks land exactly on it); only the side columns glide in */
body.entered .side{animation:sideIn .8s cubic-bezier(.2,.7,.2,1) both}
body.entered .side.right{animation-name:sideInR}
@keyframes sideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes sideInR{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.side{width:360px;flex:0 0 auto;border-right:1px solid var(--s-line);background:var(--s-panel);overflow:auto;padding:16px 17px 30px;scrollbar-width:thin}
.side.right{width:318px;border-right:0;border-left:1px solid var(--s-line)}
.scol{font-size:14px;line-height:1.58}
.h1{font-family:var(--s-display);font-size:28px;font-weight:600;line-height:1.1;margin:6px 0 6px}
.h1tc{display:block;font-family:var(--s-serif-tc);font-size:17px;font-weight:500;color:var(--s-ink2);letter-spacing:.08em;margin-top:6px}
.lede{margin:0 0 12px;font-size:15px}
.chip{border:1px solid var(--s-line);background:var(--s-soft);color:var(--s-ink2);border-radius:2px;height:23px;padding:0 8px;white-space:nowrap;
  font-family:var(--s-mono);font-size:10.5px;letter-spacing:.04em;display:inline-flex;align-items:center;gap:5px}
.chip i{width:5px;height:5px;border-radius:50%;background:var(--s-accent);font-style:normal}
.box{background:var(--s-soft);border:1px solid var(--s-line);border-radius:6px;padding:11px 12px}
.goal .goalnum{font-size:13px;color:var(--s-ink2)}.goal .goalnum b{font-size:22px;color:var(--s-accent);font-weight:500}
.gauge{position:relative;height:10px;margin:24px 0 20px;background:var(--s-raise);border-radius:5px}
.gauge i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:linear-gradient(90deg,var(--s-accent),var(--s-accent2));
  box-shadow:0 0 12px color-mix(in srgb,var(--s-accent2) 55%,transparent);transition:width .45s cubic-bezier(.2,.7,.2,1)}
.gauge em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--s-ink)}
.gauge em::after{content:attr(data-label);position:absolute;top:15px;left:-3px;transform:translateX(-100%);font:500 10px var(--s-mono);color:var(--s-ink2);white-space:nowrap;font-style:normal}
#tickHigh::after{left:50%;transform:translateX(-50%);top:auto;bottom:15px}
#tickMaster::after{left:5px;transform:none}
#tickMaster{background:var(--s-accent)}
.controls{margin:14px 0 14px;gap:6px}.controls #start{flex:1;justify-content:center;height:34px;font-size:14px}
.controls .seg button{height:32px;font-size:12.5px}
.stations{display:flex;gap:6px;margin:6px 0 8px}
.station-button{flex:1;appearance:none;border:1px solid var(--s-line2);background:var(--s-panel);border-radius:5px;padding:6px 8px;cursor:pointer;text-align:left;line-height:1.25}
.station-button b{font-family:var(--s-display);font-size:18px;color:var(--s-accent)}
.station-button small{display:block;font-family:var(--s-mono);font-size:10px;color:var(--s-ink3)}
.station-button.selected{border-color:var(--s-ink);box-shadow:inset 0 0 0 1px var(--s-ink)}
.stopbox{padding:10px 12px}
.stopbox h3{margin:0 0 4px;font:600 15px 'Geist',sans-serif;display:flex;justify-content:space-between;align-items:baseline}
.stopbox .r{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:2px 0}
.stopbox .r span:first-child{color:var(--s-ink3)}
.stopbox .r b{font-family:var(--s-mono);font-weight:500}
.stopbox .big{font-family:var(--s-mono);font-size:20px;color:var(--s-accent)}
.slots{display:flex;gap:3px;margin:3px 0 5px}
.slots i{flex:0 0 auto;width:15px;height:11px;border:1.5px solid var(--s-accent);border-radius:2px}
.slots i.on{background:var(--s-accent)}
.slots.queue i{border-color:var(--s-warn)}.slots.queue i.on{background:var(--s-warn)}
.slots.queue.full i.on{background:var(--s-bad);border-color:var(--s-bad)}
.stopbox p{margin:6px 0 0;font-size:12px;color:var(--s-ink2)}
ol.mini{margin:6px 0 0;padding-left:17px;font-size:13px;color:var(--s-ink2);line-height:1.6}
ol.mini b{color:var(--s-ink);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--s-ink2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;display:block;flex:0 0 auto}
.glowkey{border-radius:50%}
.glowkey.good{background:radial-gradient(var(--s-accent2),transparent 70%)}
.glowkey.bad{background:radial-gradient(var(--s-bad),transparent 70%)}
.tidekey{font-size:11px;gap:4px 10px}.tidekey b{font-size:11px;font-weight:500;margin-right:2px}
.tidekey .pk{width:12px;height:10px;border:2px solid var(--s-warn);border-radius:2px}

.play{flex:1;min-width:0;position:relative;padding:12px}
.mapplate{position:relative;height:100%;border-radius:8px;overflow:hidden;isolation:isolate;background:var(--s-panel);border:1px solid var(--s-line);box-shadow:var(--s-shadow)}
.mapplate::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;
  background-image:radial-gradient(var(--s-grid) 1px,transparent 1px);background-size:10px 10px;mix-blend-mode:multiply}
[data-theme="dark"] .mapplate::after{mix-blend-mode:screen}
#board,#fx{position:absolute;left:0;right:0;top:56px;bottom:72px;width:100%;height:calc(100% - 128px);display:block}
#board{z-index:1;touch-action:none;user-select:none}
#board text{font-family:'Geist','PingFang HK','Microsoft JhengHei',sans-serif;paint-order:stroke;stroke-linejoin:round}
#board [role=button]{cursor:pointer}
#fx{z-index:4;pointer-events:none;overflow:visible}
.ov{position:absolute;z-index:7}
.clockbox{left:12px;top:12px;background:var(--s-chrome);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--s-line);border-radius:7px;padding:7px 12px;box-shadow:var(--s-shadow);min-width:150px}
.clockbox .c{font-family:var(--s-mono);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.clockbox .u{font-size:10.5px;color:var(--s-ink3)}
.clockbox .prog{height:3px;border-radius:2px;background:var(--s-raise);margin-top:6px;overflow:hidden}
.clockbox .prog i{display:block;height:100%;background:var(--s-ink);width:0}
.lanebox{right:12px;top:12px;width:250px;background:var(--s-chrome);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--s-line);border-radius:7px;padding:8px 11px;box-shadow:var(--s-shadow)}
.lanebox .h{font-family:var(--s-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--s-ink3);margin-bottom:3px}
.lanebox .h b{color:var(--s-ink);font-size:12px}
.lanebox .hint{font-size:11.5px;color:var(--s-ink2);line-height:1.5}
.hud{position:absolute;left:12px;right:12px;bottom:12px;z-index:7;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--s-chrome);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
  border:1px solid var(--s-line);border-radius:7px;box-shadow:var(--s-shadow);overflow:hidden}
.hud>div{padding:8px 12px;border-right:1px solid var(--s-line);position:relative}
.hud>div:last-child{border-right:0}
.hud b{display:block;font-family:var(--s-mono);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15}
.hud small{display:block;font-size:10px;color:var(--s-ink3);letter-spacing:.03em}
.hud .good b{color:var(--s-accent)}.hud .bad b{color:var(--s-bad)}
.hud .good.pop{animation:pop .6s ease-out}
@keyframes pop{0%{background:color-mix(in srgb,var(--s-accent2) 28%,transparent)}100%{background:transparent}}
.hud .bad.hit{animation:hit .55s ease-out}
@keyframes hit{0%{background:color-mix(in srgb,var(--s-bad) 30%,transparent);transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}100%{background:transparent;transform:none}}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-8px);z-index:8;opacity:0;pointer-events:none;
  padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--s-on-accent);
  background:linear-gradient(90deg,var(--s-accent),var(--s-accent2));box-shadow:0 8px 24px color-mix(in srgb,var(--s-accent) 35%,transparent);
  transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.tide{background:linear-gradient(90deg,var(--s-warn),color-mix(in srgb,var(--s-warn) 70%,var(--s-bad)));box-shadow:0 8px 24px color-mix(in srgb,var(--s-warn) 35%,transparent)}
.toast.bad{background:linear-gradient(90deg,var(--s-bad),var(--s-warn))}

/* ---- tide table ---- */
#tide{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:8px}
#tide th{font-size:11px;font-weight:500;color:var(--s-ink3);padding:2px 2px 5px;text-align:center;line-height:1.2}
#tide th:first-child{text-align:left}
#tide td{text-align:center;padding:2px;border-top:1px solid var(--s-line);height:34px}
#tide td:first-child{text-align:left;font:400 11px var(--s-mono);color:var(--s-ink3);white-space:nowrap}
#tide td b{display:block;font:500 15px/1.05 var(--s-mono)}
#tide td i{display:block;font:normal 10px/1.2 var(--s-mono);color:var(--s-accent)}
#tide td.peak b{color:var(--s-warn)}
#tide td.peak{box-shadow:inset 0 0 0 2px var(--s-warn);border-radius:4px}
#tide td.hot i{color:var(--s-bad);font-weight:500}
#tide tr.now td{background:var(--s-raise)}
#tide tr.now td:first-child{color:var(--s-ink)}
#tide tr.past{opacity:.35}
#notice{min-height:60px;margin-top:6px}

/* ---- map effects (the feedback layer) ---- */
#fx .fx{transform-box:fill-box;transform-origin:center}
#fx .glow{animation:glow var(--d,1.5s) cubic-bezier(.2,.7,.2,1) forwards}
@keyframes glow{0%{opacity:0;transform:scale(.35)}18%{opacity:var(--peak,1)}100%{opacity:0;transform:scale(1.55)}}
#fx .ring{fill:none;stroke-width:2.2;animation:ring var(--d,1.3s) ease-out forwards}
@keyframes ring{0%{opacity:.95;transform:scale(.25)}100%{opacity:0;transform:scale(1.9)}}
#fx .float{font:600 15px var(--s-mono);paint-order:stroke;stroke-width:3;stroke-linejoin:round;animation:floatUp 1.5s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#fx .car{animation:driveOff 1.8s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes driveOff{0%{opacity:0;transform:translateX(0)}12%{opacity:1}100%{opacity:0;transform:translateX(var(--dx,-90px))}}
#fx .flash{animation:flash .7s ease-out forwards}
/* test hook: #fxfreeze=1 holds every effect mid-flight for screenshots */
.fxfreeze #fx .fx{animation-play-state:paused!important;animation-delay:-.32s!important}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}

/* ---- dialogs ---- */
dialog{border:1px solid var(--s-line2);border-radius:10px;background:var(--s-panel);color:var(--s-ink);max-width:720px;width:calc(100% - 40px);
  padding:24px 28px;max-height:88vh;overflow:auto;box-shadow:var(--s-shadow)}
dialog::backdrop{background:rgba(10,10,10,.45);backdrop-filter:blur(3px)}
dialog .h1{margin:4px 0 12px}
dialog h3{font:600 15px 'Geist',sans-serif;margin:18px 0 6px}
dialog p,dialog li{font-size:13.5px;line-height:1.75}
.close{position:absolute;right:12px;top:10px;font-size:22px;border:0;background:none;cursor:pointer;color:var(--s-ink2)}
ol.rules{padding-left:22px;margin:8px 0}ol.rules li{margin-bottom:8px}
#resultScore{font-size:20px;margin:0 0 6px}
table.result{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
table.result td,table.result th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--s-line)}
table.result th{font:500 10px var(--s-mono);letter-spacing:.08em;color:var(--s-ink3)}

(function(root) {
  // v4 · rounds prototype. Two practice boards to feel the round rules (steady departures through each round,
  // a cool-down after moving a stop, willingness falling 10 points a block). The boards are game layouts, not
  // real places: early boards are close to the simple picture "a few estates, one station, distances in blocks";
  // later boards add roads that hide it.
  // D is one object for the whole page; D.select(name) swaps the board in place (then call Tide.reset()).
  // D.use(def) loads any level definition the same way (tuning scripts).
  const pick=(typeof process!=='undefined'&&process.env&&process.env.FEEDER_MAP)||
    (typeof location!=='undefined'&&(/(?:^|[#&])map=(\w+)/.exec(location.hash)||[])[1])||'l1';
  function build(lines){
    const roads=new Set();
    for(const [x1,y1,x2,y2] of lines)
      for(let x=Math.min(x1,x2); x<=Math.max(x1,x2); x++)
        for(let y=Math.min(y1,y2); y<=Math.max(y1,y2); y++) roads.add(`${x},${y}`);
    return [...roads].map(s=>s.split(',').map(Number));
  }
  const STATION={'zh-Hant':'港鐵站','zh-Hans':'港铁站',en:'MTR STATION'};
  const hold=(phases,n=2)=>phases.flatMap(w=>Array(n).fill(w));      // each demand mix lasts n rounds
  // Tuned with bots/v4_tune.js and bots/v4_calibrate.js (see LOG.md v4): only the best few openings pass
  // without moving; high score needs moves in the countdowns; master needs nearly the best plan.
  const LEVELS={
    // Level 1 · loop corners: four estates on the corners of one loop road, the station far down one trunk road.
    // The two lower estates are nearer the station (faster buses), the two upper ones farther.
    l1:{cols:8,rows:9,margin:[110,50],hub:[4,8],hubLabel:'right',station:STATION,
      roads:build([[1,1,6,1],[1,4,6,4],[1,1,1,4],[6,1,6,4],[4,4,4,8]]),
      candidates:[[1,1],[4,1],[6,1],[1,2],[1,3],[6,2],[6,3],[1,4],[4,4],[6,4],[4,6]],
      estates:[
        {name:'北苑',hans:'北苑',cell:[1,1],house:[-50,0]},
        {name:'東邨',hans:'东邨',cell:[6,1],house:[50,0]},
        {name:'西邨',hans:'西邨',cell:[1,4],house:[-50,0]},
        {name:'南苑',hans:'南苑',cell:[6,4],house:[50,0]}],
      // the busy pair goes round the loop: top, right, bottom, left. The gentle level: neighbours are close, so people
      // turned away at a moved stop simply walk to the next one and the countdown matters less than on level 2.
      waves:hold([[14,9,3,2],[3,14,2,9],[2,3,9,14],[9,2,14,3]]),
      firstWave:20,interval:120,release:110,headway:[60,8],seats:8,moves:4,cool:20,tiers:[198,204,207]},
    // Level 2 · across the river: three estates north of a river with two bridges, one south of it, the station
    // south. Middle Bank looks right above the station but has to go round by a bridge.
    l2:{cols:10,rows:9,margin:[90,50],hub:[6,8],hubLabel:'right',station:STATION,
      roads:build([[1,1,8,1],[8,1,8,2],[2,1,2,6],[7,1,7,6],[2,6,7,6],[6,6,6,8]]),
      water:[[0,4,9,4]],bridges:[[2,4],[7,4]],
      candidates:[[1,1],[2,1],[4,1],[5,1],[7,1],[8,1],[2,3],[7,3],[2,6],[3,6],[6,6],[7,6]],
      estates:[
        {name:'西岸',hans:'西岸',cell:[1,1],house:[0,-60]},
        {name:'中岸',hans:'中岸',cell:[5,1],house:[0,-60]},
        {name:'東岸',hans:'东岸',cell:[8,2],house:[50,0]},
        {name:'南灣',hans:'南湾',cell:[3,6],house:[0,58]}],
      // two estates busy at once, more people than level 1; the river keeps people from simply walking to another stop
      waves:hold([[16,10,3,3],[3,10,16,3],[3,3,10,16],[16,3,3,10]]),
      firstWave:20,interval:120,release:110,headway:[60,8],seats:8,moves:4,cool:20,tiers:[196,206,215]}
  };
  // A level from the level editor (editor.html): given in the address by "Test play" (#lv=…), or the last one saved
  // in this browser (#map=custom). Same fields as a level above; water is a list of cells, a road across water is a bridge.
  function fromEditor(def){
    const roads=def.roads||build(def.lines||[]),k=c=>c.join(','),road=new Set(roads.map(k)),cells=def.waterCells||[];
    const water=[],left=new Set(cells.map(k));
    for(const [x,y] of [...cells].sort((a,b)=>a[1]-b[1]||a[0]-b[0])){if(!left.has(k([x,y])))continue;
      let e=x;while(left.has(k([e+1,y])))e++;for(let i=x;i<=e;i++)left.delete(k([i,y]));water.push([x,y,e,y]);}
    const total=(def.waves||[]).flat().reduce((a,b)=>a+b,0),guess=!(def.tiers||[]).some(x=>x>0);
    const tiers=guess?[.6,.75,.9].map(f=>Math.ceil(f*total)):def.tiers;
    return {station:STATION,margin:[60,50],hubLabel:'right',firstWave:20,...def,tiers,tiersGuess:guess,roads,water,bridges:cells.filter(c=>road.has(k(c)))};
  }
  function customDef(){
    const h=typeof location!=='undefined'?location.hash:'';
    try{const m=/(?:^|[#&])lv=([^&]+)/.exec(h);if(m)return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));}catch(e){}
    try{if(/(?:^|[#&])map=custom/.test(h)){const s=localStorage.getItem('tl-v4-level');if(s)return JSON.parse(s);}}catch(e){}
    return null;
  }
  const custom=customDef();if(custom)LEVELS.custom=fromEditor(custom);
  function make(key,L){
    const waves=L.waves.map(w=>w.slice());
    const origins=L.estates.map((e,i)=>({...e,count:waves.reduce((s,w)=>s+w[i],0),base:Math.min(...waves.map(w=>w[i]))}));
    const out={map:key,origins,waves,peaks:[],levels:Object.keys(LEVELS)};
    for(const k of ['title','tiersGuess','cols','rows','margin','hub','hubLabel','station','roads','water','bridges','candidates','headway','tiers','firstWave','interval',
      'release','seats','queue','cool','moves','willing','patience','tail'])if(L[k]!==undefined)out[k]=L[k];
    return out;
  }
  const first=custom&&(/(?:^|[#&])lv=/.test(typeof location!=='undefined'?location.hash:'')||pick==='custom')?'custom':LEVELS[pick]?pick:'l1';
  const D=make(first,LEVELS[first]);
  const swap=next=>{for(const k of Object.keys(D))delete D[k];Object.assign(D,next);return true;};
  Object.defineProperty(D,'select',{enumerable:false,value(name){return LEVELS[name]?swap(make(name,LEVELS[name])):false;}});
  Object.defineProperty(D,'use',{enumerable:false,value(def,key='custom'){return swap(make(key,{...def,roads:def.lines?build(def.lines):def.roads}));}});
  Object.defineProperty(D,'build',{enumerable:false,value:build});
  // the editor: load its level in place, and read the built-in levels as starting points
  Object.defineProperty(D,'loadEditor',{enumerable:false,value(def){return swap(make('custom',fromEditor(def)));}});
  Object.defineProperty(D,'example',{enumerable:false,value(name){return LEVELS[name]?JSON.parse(JSON.stringify(LEVELS[name])):null;}});
  if(typeof module!=='undefined') module.exports=D;
  root.TIDE_DATA=D;
})(typeof window!=='undefined'?window:globalThis);

</script><script>
(function(root) {
  'use strict';
  const D=typeof module!=='undefined'?require('./data.js'):root.TIDE_DATA;
  // Seconds are game time, not real transport calibration.
  // v4 (rounds): every round each estate sends people out steadily over the whole round (release), so a stop
  // is never idle at the end of a round. Moving a stop takes `cool` seconds of game time; the bus timetable keeps
  // running meanwhile (departures during the cool-down leave empty). Willingness falls 10 points a block.
  // Each level sets its own rhythm, willingness, capacity and tiers (reset()).
  const P={tick:.5,duration:1080,firstWave:35,interval:120,release:110,
    walkStep:12,busStep:10,headwayBase:60,headwayStep:10,seats:6,queue:8,cool:20,moves:4,
    willing:[1,.9,.8,.7,.6,.5,.4],homeGrace:50,homeThink:20,patience:210,
    reconsider:4,target:133,highScore:140,masterScore:146};
  const key=c=>c.join(','), same=(a,b)=>a&&b&&key(a)===key(b);
  function rng(seed) { return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;}; }
  // Everything derived from the board. reset() rebuilds it after D.select() swaps the board in place.
  let graph=new Map(), cache=new Map();
  const toMTR=[];
  function route(a,b) {
    const k=key(a)+'>'+key(b);
    if(cache.has(k)) return cache.get(k).map(c=>c.slice());
    const q=[a],parent=new Map([[key(a),null]]);
    for(let i=0;i<q.length;i++) {
      const c=q[i]; if(same(c,b)) break;
      for(const n of [[c[0]+1,c[1]],[c[0]-1,c[1]],[c[0],c[1]+1],[c[0],c[1]-1]])
        if(graph.has(key(n))&&!parent.has(key(n))) {parent.set(key(n),c);q.push(n);}
    }
    if(!parent.has(key(b))) return [];
    const out=[];let c=b;while(c){out.push(c);c=parent.get(key(c));}
    out.reverse();cache.set(k,out);return out.map(c=>c.slice());
  }
  const dist=(a,b)=>route(a,b).length-1;
  const length=path=>path.slice(1).reduce((n,c,i)=>n+Math.abs(c[0]-path[i][0])+Math.abs(c[1]-path[i][1]),0);
  const willing=steps=>steps<0?0:(P.willing[steps]??0);
  // These residents drive today because the MTR is too far to walk. A stop that is as far on foot as the MTR
  // itself (or lies beyond it) wins nobody — nobody walks past the station to ride back to it.
  function reset() {
    graph=new Map(D.roads.map(c=>[key(c),c]));cache=new Map();
    // each board carries its own headway formula and score tiers
    [P.headwayBase,P.headwayStep]=D.headway||[60,10];
    if(D.tiers)[P.target,P.highScore,P.masterScore]=D.tiers;
    for(const k of ['firstWave','interval','release','seats','queue','cool','moves','willing','patience'])if(D[k]!==undefined)P[k]=Array.isArray(D[k])?D[k].slice():D[k];
    // after the last round people still walk, wait and ride: the game ends when everyone has an outcome
    // (delivered or drove), or at the latest `tail` seconds after the last round
    P.lastRound=P.firstWave+D.waves.length*P.interval;
    // the latest anyone can still be on the way: full patience, then the slowest bus and the longest ride
    const hwMax=Math.max(...D.candidates.map(c=>P.headwayBase+dist(c,D.hub)*P.headwayStep));
    const rideMax=Math.max(...D.candidates.map(c=>length(route(c,D.hub))*P.busStep));
    // counted from the last person to leave home (a level may spread departures past the end of its last round)
    const lastBorn=Math.max(P.lastRound,P.firstWave+(D.waves.length-1)*P.interval+P.release);
    P.duration=lastBorn+(D.tail??Math.ceil((P.patience+20+hwMax+rideMax+30)/10)*10);
    toMTR.splice(0,toMTR.length,...D.origins.map(o=>dist(o.cell,D.hub)));
  }
  reset();
  const shareAt=(origin,cell,walked=0,from=D.origins[origin].cell)=>{const total=walked+dist(from,cell);return total<toMTR[origin]?willing(total):0;};
  // How many of n people in one batch come when the share is w (thresholds are evenly spread).
  const comes=(n,w)=>Math.max(0,Math.min(n,Math.ceil(w*n-.5)));
  const headwayAt=cell=>P.headwayBase+dist(cell,D.hub)*P.headwayStep;
  function along(path,elapsed,step) {
    let left=Math.max(0,elapsed/step);
    for(let i=1;i<path.length;i++) {
      const a=path[i-1],b=path[i],d=Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1]);
      if(left<d) return[a[0]+(b[0]-a[0])*left/d,a[1]+(b[1]-a[1])*left/d];
      left-=d;
    }
    return(path.at(-1)||[0,0]).slice();
  }
  class Game {
    constructor(seed=1781) {
      Object.assign(this,{seed,t:0,started:false,done:false,moves:P.moves,delivered:0,cars:0,missed:0,steps:0,acc:0,events:[],commands:[],people:[]});
      this.trips=[];
      this.stops=[0,1,2].map(id=>({id,cell:null,version:0,ready:0,queue:[],boarding:[],peak:0,rejected:0,serial:0,departAt:Infinity}));
      const r=rng(seed);let id=0;
      D.waves.forEach((w,wi)=>w.forEach((n,o)=>{
        // Evenly spread willingness thresholds, shuffled: exactly comes(n,w) people accept a share w.
        const thresholds=Array.from({length:n},(_,k)=>(k+.5)/n);
        for(let k=n-1;k>0;k--){const j=Math.floor(r()*(k+1));[thresholds[k],thresholds[j]]=[thresholds[j],thresholds[k]];}
        for(let j=0;j<n;j++) this.people.push({id:id++,origin:o,wave:wi,
          born:P.firstWave+wi*P.interval+(j+.5)/n*P.release,
          state:'future',preference:thresholds[j],budget:P.patience+40*(r()-.5),
          trips:0,switched:false,retryAt:0,avoid:[],walked:0,giveUp:false,
          path:[D.origins[o].cell],since:0,target:null,deadline:Infinity});
      }));
      this.people.sort((a,b)=>a.born-b.born||a.id-b.id);
    }
    emit(type,p,extra={}) {this.events.push({time:this.t,type,id:p?.id,origin:p?.origin,...extra});}
    person(id) {return this.people.find(p=>p.id===id);}
    headway(s) {return headwayAt(s.cell);}
    // opening + commands + seed is the whole round: replaying them gives the same score (verify_result.js)
    start() {if(this.started||this.stops.some(s=>!s.cell))return false;this.started=true;this.opening=this.stops.map(s=>s.cell.slice());for(const s of this.stops)s.departAt=this.headway(s);return true;}
    place(id,cell) {
      const s=this.stops[id];
      if(this.done||!s||!D.candidates.some(c=>same(c,cell))||this.stops.some(x=>x.id!==id&&same(x.cell,cell))||same(s.cell,cell))return false;
      if(this.started&&this.moves<=0)return false;

      if(this.started){this.moves--;this.commands.push({time:this.t,id,cell:cell.slice()});}

        if(this.started&&s.boarding.length)this.depart(s,old);

        // and may try again once the new stop is ready (the move was not their failure).
        const waiting=s.queue.map(pid=>this.person(pid)).filter(p=>p.state==='queue');
        s.queue=[];s.boarding=[];
        for(const p of waiting)this.reroute(p,old,null,'搬站返家');
        for(const p of this.people) if(p.state==='walk'&&p.target===id) {
          const anchor=this.currentNode(p),pos=this.pos(p);
          p.walked+=(this.t-p.since)/P.walkStep;p.path=[pos];p.since=this.t;
          this.reroute(p,anchor,null,'原站搬遷',id);

      let left=Math.max(0,(this.t-p.since)/P.walkStep);
      for(let i=1;i<p.path.length;i++) {
        const d=length([p.path[i-1],p.path[i]]);
        if(left<d-1e-8)return p.path[i].slice();left-=d;
      }
      return p.path.at(-1).slice();
    }
    walkingPath(p,from,to) {
      const path=route(from,to),pos=['walk','return','queue','seated'].includes(p.state)?this.pos(p):from;
      return same(pos,from)?path:[pos,...path];
    }
    eta(s) {return s.cell?Math.max(0,s.departAt-this.t):Infinity;}

    // after this person was turned away there, or if they cannot make a bus in time.
    attraction(p,s,from=D.origins[p.origin].cell,walked=0) {
      if(!s.cell||s.ready>this.t||p.avoid.includes(s.id+':'+s.version))return 0;
      if(s.queue.length>=P.queue&&s.boarding.length>=P.seats)return 0;   // a full stop attracts nobody at the moment they decide

      else{p.retryAt=this.t+P.reconsider;

    // walk (already walked + still to walk) is still within their willingness — once per trip; otherwise walk
    // home, think for homeThink seconds, then choose once between the nearest stop that suits them (by the same
    // distance rule; the stop that was full counts again unless it is still full) and driving. At most two trips
    // out from home. Whoever is already walking never turns back, even if a nearer stop frees up.
    reroute(p,here,failed,why,excluded=-1) {
      this.leave(p);

    goHome(p,why,from,turnedAway) {

      if(turnedAway)p.avoid.push(turnedAway.id+':'+turnedAway.version);
      for(const s of this.stops){s.queue=s.queue.filter(id=>id!==p.id);s.boarding=s.boarding.filter(id=>id!==p.id);}
      const anchor=from||this.currentNode(p),path=this.walkingPath(p,anchor,D.origins[p.origin].cell);

    car(p) {
      if(['car','delivered','bus','missed'].includes(p.state))return;
      for(const s of this.stops){s.queue=s.queue.filter(id=>id!==p.id);s.boarding=s.boarding.filter(id=>id!==p.id);}
      p.state='car';p.since=this.t;this.cars++;this.emit('car',p,{why:p.lastWhy||'沒有夠近的站'});

    board(s) {
      if(s.ready>this.t)return;
      while(s.boarding.length<P.seats&&s.queue.length){const id=s.queue.shift(),p=this.person(id);
        if(p.state!=='queue'||p.deadline<=this.t)continue;
        s.boarding.push(id);p.state='seated';this.emit('board',p,{stop:s.id});}
    }
    buses() {
      for(const b of this.trips.filter(b=>!b.done))if(this.t>=b.end){
        for(const id of b.load){const p=this.person(id);p.state='delivered';p.since=this.t;this.delivered++;this.emit('delivered',p,{stop:b.stop});}
        b.done=true;
      }
      for(const s of this.stops){if(!s.cell)continue;
        if(s.ready>this.t){while(this.t+1e-6>=s.departAt)s.departAt+=this.headway(s);continue;}   // cooling down: buses pass empty
        for(const id of [...s.queue]){const p=this.person(id);if(this.t>=p.deadline)this.reroute(p,s.cell.slice(),s,'久候返家');}
        this.board(s);if(this.t+1e-6<s.departAt)continue;
        this.depart(s,s.cell);s.departAt=this.t+this.headway(s);this.board(s);
      }
    }
    // A departure from `from` (the stop's cell, or its old cell when it is moved). Fleet circulation is abstracted in
    // the headway; the map displays only the loaded, one-way feeder trip to MTR.
    depart(s,from) {
      const path=route(from,D.hub),load=s.boarding.splice(0),serial=++s.serial;
      if(load.length){this.trips.push({stop:s.id,serial,path,since:this.t,end:this.t+length(path)*P.busStep,load,done:false});
        for(const id of load){const p=this.person(id);p.state='bus';p.since=this.t;this.emit('depart',p,{stop:s.id,serial});}}
      this.emit('dispatch',null,{stop:s.id,serial,load:load.length});
    }
    closeSession() {
      for(const p of this.people)if(!['car','delivered'].includes(p.state)){p.state='missed';this.missed++;}
      for(const s of this.stops){s.queue=[];s.boarding=[];}
      for(const b of this.trips)b.done=true;
      this.done=true;this.emit('finish');
    }
    step() {
      this.steps++;this.t=+(this.steps*P.tick).toFixed(4);this.buses();
      for(const p of this.people){
        if(p.state==='future'&&this.t>=p.born){Object.assign(p,{state:'home',deadline:this.t+p.budget,homeUntil:this.t+P.homeGrace,retryAt:this.t});this.emit('spawn',p);}

          if(this.t>=p.deadline||this.t>=p.homeUntil)this.car(p);
          else if(p.trips<2&&this.t>=p.retryAt)this.decide(p);

          const s=this.stops[p.target];p.walked+=length(p.path);
          if(s&&s.ready<=this.t&&(s.boarding.length<P.seats||s.queue.length<P.queue)&&this.t<p.deadline){
            p.state='queue';p.path=[s.cell.slice()];p.since=this.t;s.queue.push(p.id);this.emit('queue',p,{stop:s.id});

          }else{const full=s&&s.queue.length>=P.queue&&s.boarding.length>=P.seats,here=p.path.at(-1).slice();
            if(full){s.rejected++;this.emit('full',p,{stop:s.id});}
            if(this.t>=p.deadline){p.giveUp=true;p.lastWhy='等太久';this.leave(p);this.goHome(p,'耐心耗盡',here);}
            else this.reroute(p,here,full?s:null,full?'站已滿員':'站還在重建');}
        } else if(p.state==='queue'&&this.t>=p.deadline){const s=this.stops[p.target];this.reroute(p,s.cell.slice(),s,'久候返家');}
        else if(p.state==='return'&&this.t-p.since+1e-6>=length(p.path)*P.walkStep){
          if(p.giveUp){this.car(p);continue;}
          // home again: think for a while, then one decision — the nearest suitable stop, or the car
          Object.assign(p,{state:'home',path:[D.origins[p.origin].cell],since:this.t,avoid:[],homeUntil:Math.min(p.deadline,this.t+P.homeThink+P.tick),retryAt:this.t+P.homeThink});this.emit('home',p);
        }else if(p.state==='walk'&&this.t>=p.deadline){p.giveUp=true;p.lastWhy='等太久';this.goHome(p,'耐心耗盡');}
      }

    }

      if(!this.started||this.done)return;this.acc+=Math.max(0,seconds);
      while(this.acc+1e-8>=P.tick&&!this.done){this.acc-=P.tick;this.step();}
    }
    waveInfo() {
      const active=D.waves.findIndex((w,i)=>this.t>=P.firstWave+i*P.interval&&this.t<P.firstWave+i*P.interval+P.release);
      const next=D.waves.findIndex((w,i)=>P.firstWave+i*P.interval>this.t);

    }
    // Map preview: share and head count from each estate for a set of stop cells
    // (replace stop `id` by `cell` to preview a placement). Ignores queues and patience.
    forecast(id=-1,cell=null) {
      const cells=this.stops.map(s=>s.id===id?cell:s.cell);

    'r.h2':L('已經跟上了潮汐（挪站 {m} 次）。潮汐大師要 {n}：開局就把站擺在高峰最多的方向，再讓一座站跟著高峰走。','已经跟上了潮汐（挪站 {m} 次）。潮汐大师要 {n}：开局就把站摆在高峰最多的方向，再让一座站跟着高峰走。','You kept up with the tide ({m} moves). Tide master needs {n}: open with stops where most peaks come, then let one stop follow the peaks.'),
    'r.h1moved':L('靠挪站過關了。高分 {n} 要每次高峰前約 30 秒就把站挪到位。','靠挪站过关了。高分 {n} 要每次高峰前约 30 秒就把站挪到位。','Cleared by moving stops. High score {n} needs each move in place about 30 s before a peak.'),
    'r.h1static':L('開局擺得很準，一站不挪也過關了。高分 {n} 光靠擺站到不了，要跟著潮汐表挪站。','开局摆得很准，一站不挪也过关了。高分 {n} 光靠摆站到不了，要跟着潮汐表挪站。','A spot-on opening — cleared without a single move. High score {n} can’t be reached by placement alone: move stops with the tide table.'),
    'r.h0far':L('開車的人裡，最多是因為「太遠」（{n} 人）：站離屋苑每近一格，願意來的人多 20%。','开车的人里，最多是因为「太远」（{n} 人）：站离屋苑每近一格，愿意来的人多 20%。','Most drivers left because no stop was near enough ({n}): each block closer brings 20% more people.'),
    'r.h0other':L('開車的人裡，最多是因為「{why}」（{n} 人）：看潮汐表，在高峰前 30 秒把一座站搬到那個屋苑旁邊，分走一部分人。','开车的人里，最多是因为「{why}」（{n} 人）：看潮汐表，在高峰前 30 秒把一座站搬到那个屋苑旁边，分走一部分人。','Most drivers left because “{why}” ({n}): watch the tide table and move a stop next to that estate 30 s before its peak.'),
    'why.far':L('沒有夠近的站','没有够近的站','no stop near enough'),'why.full':L('站滿了','站满了','stop full'),'why.wait':L('等太久','等太久','waited too long'),
    'r.again':L('再試一局 ↺','再试一局 ↺','Play again ↺'),'r.board':L('查看棋盤','查看棋盘','View board'),'r.save':L('保存本局紀錄','保存本局记录','Save this run'),'r.map':L('回到地圖','回到地图','Back to map'),
    // rules & sources
    'i.lbl':L('Rules & sources · 規則與資料','Rules & sources · 规则与资料','Rules & sources'),'i.h':L('規則','规则','Rules'),
    'i.r1':L('<b>意願只看走路距離。</b>從屋苑沿道路走到站：0–1 格 100%，2 格 80%，3 格 60%，4 格 40%，5 格 20%，6 格以上 0%。每批人裡正好這個比例的人會出門去站，其餘的人直接開車。有幾座站可選時，去比例最高的那座（一樣高就去班次密的）。<b>正在滿員（8 個排隊位都滿）的站，在他做決定的那一刻沒有吸引力</b>；已經在路上的人不會因為近的站空出來而回頭。',
      '<b>意愿只看走路距离。</b>从屋苑沿道路走到站：0–1 格 100%，2 格 80%，3 格 60%，4 格 40%，5 格 20%，6 格以上 0%。每批人里正好这个比例的人会出门去站，其余的人直接开车。有几座站可选时，去比例最高的那座（一样高就去班次密的）。<b>正在满员（8 个排队位都满）的站，在他做决定的那一刻没有吸引力</b>；已经在路上的人不会因为近的站空出来而回头。',
      '<b>Willingness depends only on walking distance.</b> Along the roads from the estate to the stop: 0–1 block 100%, 2 blocks 80%, 3 60%, 4 40%, 5 20%, 6 or more 0%. Exactly that share of each batch heads for the stop; the rest drive. With several stops to choose from, people pick the highest share (on a tie, the more frequent one). <b>A stop that is full (all 8 queue places taken) attracts nobody at the moment they decide</b>; people already walking never turn back because a nearer stop frees up.'),
    'i.r2':L('<b>站要比港鐵近。</b>這些人今天開車，就是因為走去港鐵太遠；要走得和去港鐵一樣遠（或要越過港鐵）的站，他們不會去。所以不會有人走過港鐵再坐車回來。',
      '<b>站要比港铁近。</b>这些人今天开车，就是因为走去港铁太远；要走得和去港铁一样远（或要越过港铁）的站，他们不会去。所以不会有人走过港铁再坐车回来。',
      '<b>A stop must be closer than the MTR.</b> These people drive today because the station is too far to walk. A stop as far as the station, or beyond it, wins nobody — nobody walks past the MTR to ride back to it.'),
    'i.r3':L('<b>定時發車。</b>每座站的班距＝{base} 秒＋到港鐵的道路格數×{step} 秒。車在站內上客，倒數到零才開；每班 6 座，另有 8 個排隊位。巴士每格行駛 10 秒，到港鐵下車才得 1 分。',
      '<b>定时发车。</b>每座站的班距＝{base} 秒＋到港铁的道路格数×{step} 秒。车在站内上客，倒数到零才开；每班 6 座，另有 8 个排队位。巴士每格行驶 10 秒，到港铁下车才得 1 分。',
      '<b>Buses run to a timetable.</b> Each stop’s headway = {base} s + {step} s × road blocks to the MTR. The bus boards at the stop and leaves when the countdown reaches zero; 6 seats, plus 8 queue places. Buses take 10 s a block; a point counts only when the passenger steps off at the MTR.'),
    'i.r4':L('<b>滿了、等久了就近換站。</b>到站時隊伍已滿，或在站上等超過約 2 分鐘，就在原地看另一座站：全程走路格數（已走的＋還要走的）按同一張表仍在他的意願內、而且仍比港鐵近，就直接走過去（每趟出門最多換一次）；不然就走回家，想 20 秒後再決定一次：最近的站夠近、而且那一刻沒有滿就再出門，否則開車。每人最多從家裡出門兩次。從出門起總耐心約 3.5 分鐘，不會重置。',
      '<b>满了、等久了就近换站。</b>到站时队伍已满，或在站上等超过约 2 分钟，就在原地看另一座站：全程走路格数（已走的＋还要走的）按同一张表仍在他的意愿内、而且仍比港铁近，就直接走过去（每趟出门最多换一次）；不然就走回家，想 20 秒后再决定一次：最近的站够近、而且那一刻没有满就再出门，否则开车。每人最多从家里出门两次。从出门起总耐心约 3.5 分钟，不会重置。',
      '<b>Full, or waited too long? Try the nearest other stop.</b> If the queue is full on arrival, or they have waited about 2 minutes, people look at another stop from where they stand: if the whole walk (walked so far + still to go) is still within their willingness on the same table, and still closer than the MTR, they walk on (at most one switch per trip). Otherwise they walk home, think for 20 s and decide once more: out again to the nearest stop if it is near enough and not full at that moment, or drive. At most two trips out from home; total patience about 3.5 minutes from first leaving, never reset.'),
    'i.r5':L('<b>可以搬站。</b>開局後一共 6 次，搬後重建 20 秒，重建好再等一個班距才發第一班。還在站上的人就近換站，或走回家再考慮；已開出的巴士照常送達。',
      '<b>可以搬站。</b>开局后一共 6 次，搬后重建 20 秒，重建好再等一个班距才发第一班。还在站上的人就近换站，或走回家再考虑；已开出的巴士照常送达。',
      '<b>You can move stops.</b> 6 moves after the start; a moved stop rebuilds for 20 s, then waits one headway before its first bus. People still at the stop try the nearest other stop or walk home to think again; buses already out still arrive.'),
    'i.r6':L('<b>潮汐表。</b>8 批人，每 2 分鐘一批，每批在 30 秒內陸續出門。平時：{big}每批 6 人，其他各區每批 3 人；每區一次高峰，那一批多 18 人。',
      '<b>潮汐表。</b>8 批人，每 2 分钟一批，每批在 30 秒内陆续出门。平时：{big}每批 6 人，其他各区每批 3 人；每区一次高峰，那一批多 18 人。',
      '<b>The tide table.</b> 8 batches, one every 2 minutes, each leaving home over 30 s. Normally {big} sends 6 per batch and every other estate 3; each estate has one peak with 18 more.'),
    'i.real':L('哪些是真的','哪些是真的','What is real'),
    'i.scope':L('本關只表達接駁的步行距離、班次與運力怎樣影響大家坐不坐公共交通；土地開發（TOD）與真實減碳核算留待後續關卡。','本关只表达接驳的步行距离、班次与运力怎样影响大家坐不坐公共交通；土地开发（TOD）与真实减碳核算留待后续关卡。','This level only shows how the walking distance, frequency and capacity of feeders decide whether people take public transport; land use (TOD) and real carbon accounting are left to later levels.'),
    'i.cover':L('開場地圖：組員「TransitLab 產品套件」的潮汐封面，運輸署幹道探測器逐小時車流（{p}）；圓點是全港 455 個分區的出行量。','开场地图：组员「TransitLab 产品套件」的潮汐封面，运输署干道探测器逐小时车流（{p}）；圆点是全港 455 个分区的出行量。','Opening map: the tide cover from our team’s TransitLab product suite — hourly flows from Transport Department trunk-road detectors ({p}); the dots are trips in 455 zones across Hong Kong.'),
    'src.fanling':L('粉嶺站、五個分區的名字與早高峰開車人數取自 TransitLab 本地模型；分區位置按真實步行距離（OpenStreetMap 行人路網）與方位畫成約 350 米一格的棋盤，略作遊戲化：山麗苑真實步行約 3.1 公里，棋盤縮為 8 格。車站在西、各區在東側一個扇形裡；鳳凰嶺邨與和合石之間真的有比去車站還近的共用位置。道路為示意，不是實測道路或獲准設站位置。',
      '粉岭站、五个分区的名字与早高峰开车人数取自 TransitLab 本地模型；分区位置按真实步行距离（OpenStreetMap 行人路网）与方位画成约 350 米一格的棋盘，略作游戏化：山丽苑真实步行约 3.1 公里，棋盘缩为 8 格。车站在西、各区在东侧一个扇形里；凤凰岭邨与和合石之间真的有比去车站还近的共用位置。道路为示意，不是实测道路或获准设站位置。',
      'Fanling station and the names and morning-peak car trips of five zones come from the TransitLab local model. The zones are placed on a board of about 350 m a block by real walking distance (OpenStreetMap footpaths) and bearing, lightly gamified: 山麗苑 is about 3.1 km on foot, shrunk to 8 blocks. The station sits to the west and the estates fan out to its east; 鳳凰嶺邨 and 和合石 really do share a spot nearer than the station. Roads are schematic, not surveyed roads or approved stop sites.'),
    'src.yuenlong':L('元朗站與四個分區的名字、早高峰開車人數取自 TransitLab 本地模型；按真實步行距離（大棠路 0.8、蝶翠峰 1.6、朗善邨一帶 2.0、崇山新村 3.0 公里）與方位畫成約 350 米一格的棋盤，略作遊戲化。四區都在車站南面一條走廊上，相鄰兩區可以共用接駁站。道路為示意。',
      '元朗站与四个分区的名字、早高峰开车人数取自 TransitLab 本地模型；按真实步行距离（大棠路 0.8、蝶翠峰 1.6、朗善邨一带 2.0、崇山新村 3.0 公里）与方位画成约 350 米一格的棋盘，略作游戏化。四区都在车站南面一条走廊上，相邻两区可以共用接驳站。道路为示意。',
      'Yuen Long station and the names and morning-peak car trips of four zones come from the TransitLab local model, laid out on a board of about 350 m a block by real walking distance (大棠路 0.8, 蝶翠峰 1.6, 朗善邨一帶 2.0, 崇山新村 3.0 km) and bearing, lightly gamified. All four sit in one corridor south of the station; neighbours can share a feeder stop. Roads are schematic.'),
    'src.longping':L('v2.5 的原版棋盤：朗屏站與四個分區的相對方位取自 TransitLab 本地資料，道路重畫為棋盤示意。（後來核對發現唐人新村、蝶翠峰最近的港鐵站其實是天水圍和元朗。）',
      'v2.5 的原版棋盘：朗屏站与四个分区的相对方位取自 TransitLab 本地资料，道路重画为棋盘示意。（后来核对发现唐人新村、蝶翠峰最近的港铁站其实是天水围和元朗。）',
      'The original v2.5 board: Long Ping station and the relative bearings of four zones come from TransitLab local data, with roads redrawn as a schematic grid. (A later check found that the nearest stations of 唐人新村 and 蝶翠峰 are really Tin Shui Wai and Yuen Long.)'),
    'src.demand':L('各區平時人數：開車最多的一區每批 6 人，其他每批 3 人；每區一次高峰（多 18 人）。人數與時間均為遊戲假設，不代表真實客流或減碳量。',
      '各区平时人数：开车最多的一区每批 6 人，其他每批 3 人；每区一次高峰（多 18 人）。人数与时间均为游戏假设，不代表真实客流或减碳量。',
      'Normal numbers: the estate with the most drivers sends 6 per batch, the others 3; each estate has one peak (+18). Numbers and times are game assumptions, not real ridership or carbon savings.'),
    'close':L('關閉','关闭','Close')

    'lvEn.l1':L('Loop corners','Loop corners','Loop corners'),'lvEn.l2':L('Across the river','Across the river','Across the river'),
    'g.level':L('關卡','关卡','Level'),'g.l1':L('第一關','第一关','Level 1'),'g.l2':L('第二關','第二关','Level 2'),
    'g.titleTc':L('{s}','{s}',''),
    'g.mode':L('Mode 01 · v4 試玩','Mode 01 · v4 试玩','Mode 01 · v4 trial'),
    'g.chip':L('輪次規則','轮次规则','Round rules'),
    'g.lede':L('Three stops, one station, eight rounds.<span class="tcb">三座接駁站，八輪需求。每輪開始前 3 秒倒數，隨時可以暫停慢慢想。</span>',
      'Three stops, one station, eight rounds.<span class="tcb">三座接驳站，八轮需求。每轮开始前 3 秒倒数，随时可以暂停慢慢想。</span>',
      'Three stops, one station, eight rounds. A 3-second countdown before each round; pause any time to think.'),
    'g.goal':L('<b>{pass}</b> 過關：開局三站要擺得很準，不然要靠挪站補救。<b>{high}</b> 高分：一定要在換輪前挪站。<b>{master}</b> 潮汐大師：每一次挪站都在對的時候、對的地方。',
      '<b>{pass}</b> 过关：开局三站要摆得很准，不然要靠挪站补救。<b>{high}</b> 高分：一定要在换轮前挪站。<b>{master}</b> 潮汐大师：每一次挪站都在对的时候、对的地方。',
      '<b>{pass}</b> to pass: the opening three stops must be spot on, or you rescue it by moving stops. <b>{high}</b> high score: you must move stops before rounds change. <b>{master}</b> tide master: every move at the right time and place.'),
    'g.rule1':L('<b>離站越遠，越少人來。</b>站在屋苑門口全來，每多走 1 格少 10%（1 格 90%，2 格 80%……）。圈上的比例就是真的會來的比例。站要比港鐵近才有人去。',
      '<b>离站越远，越少人来。</b>站在屋苑门口全来，每多走 1 格少 10%（1 格 90%，2 格 80%……）。圈上的比例就是真的会来的比例。站要比港铁近才有人去。',
      '<b>The farther the stop, the fewer come.</b> A stop at the estate gets everyone; each extra block loses 10% (1 block 90%, 2 blocks 80%…). The share on the circle is exactly who comes. A stop must be closer than the MTR itself.'),
    'g.rule2':L('<b>離港鐵越近，班次越密。</b>班距＝{base} 秒＋到港鐵每格 {step} 秒；每班 {seats} 座，最多再排 {queue} 人。正滿的站沒人會選；到站才發現滿了就近換站，換不了就回家想 20 秒，再從「最近的站」和「開車」中選一個。',
      '<b>离港铁越近，班次越密。</b>班距＝{base} 秒＋到港铁每格 {step} 秒；每班 {seats} 座，最多再排 {queue} 人。正满的站没人会选；到站才发现满了就近换站，换不了就回家想 20 秒，再从「最近的站」和「开车」中选一个。',
      '<b>The closer to the MTR, the more frequent.</b> Headway = {base} s + {step} s per block to the MTR; {seats} seats a bus, up to {queue} more in the queue. Nobody picks a full stop; turned away, people try the nearest other stop, or go home, think 20 s, then choose “the nearest stop” or “drive”.'),
    'g.rule3':L('<b>看潮汐表，換輪前挪站。</b>每輪 2 分鐘，各區的人整輪陸續出門。可以挪站 {moves} 次，挪完冷卻 {cool} 秒（不上客，班車照開）。每輪開始前 3 秒倒數；暫停時挪的站可以撤銷。',
      '<b>看潮汐表，换轮前挪站。</b>每轮 2 分钟，各区的人整轮陆续出门。可以挪站 {moves} 次，挪完冷却 {cool} 秒（不上客，班车照开）。每轮开始前 3 秒倒数；暂停时挪的站可以撤销。',
      '<b>Read the tide table; move before a round.</b> Each round is 2 minutes and people leave home steadily through it. {moves} moves; a moved stop cools down {cool} s (no boarding, buses still run). A 3-second countdown before each round; moves made while paused can be undone.'),
    'g.tideChip':L('8 輪 · 每 2 分鐘','8 轮 · 每 2 分钟','8 rounds · 2 min each'),
    'g.tideChipTitle':L('每輪 2 分鐘，人在整輪裡陸續出門','每轮 2 分钟，人在整轮里陆续出门','2 minutes a round; people leave steadily through it'),
    'g.tideKey':L('<span><b class="mono">9</b>這輪出門人數</span><span><b class="mono" style="color:var(--s-accent)">會來 6</b>按現在站位</span><span><i class="pk"></i>人多</span><span><b class="mono" style="color:var(--s-bad)">會來 9</b>可能擠爆</span>',
      '<span><b class="mono">9</b>这轮出门人数</span><span><b class="mono" style="color:var(--s-accent)">会来 6</b>按现在站位</span><span><i class="pk"></i>人多</span><span><b class="mono" style="color:var(--s-bad)">会来 9</b>可能挤爆</span>',
      '<span><b class="mono">9</b>leave home this round</span><span><b class="mono" style="color:var(--s-accent)">come 6</b>with these stops</span><span><i class="pk"></i>busy</span><span><b class="mono" style="color:var(--s-bad)">come 9</b>may overflow</span>'),

    'r.h3':L('每一輪都接住了，挪站時機也對。','每一轮都接住了，挪站时机也对。','Every round caught, every move on time.'),
    'r.h2':L('已經跟上了換輪（挪站 {m} 次）。潮汐大師要 {n}：開局擺對，再在每次換輪前，把下一輪最閒的那座站挪到人最多的地方。','已经跟上了换轮（挪站 {m} 次）。潮汐大师要 {n}：开局摆对，再在每次换轮前，把下一轮最闲的那座站挪到人最多的地方。','You kept up with the rounds ({m} moves). Tide master needs {n}: the right opening, then before each change move the stop that will be idlest to where most people are.'),

    'r.h1static':L('開局擺得很準，一站不挪也過關了。高分 {n} 光靠擺站到不了，要在換輪前挪站。','开局摆得很准，一站不挪也过关了。高分 {n} 光靠摆站到不了，要在换轮前挪站。','A precise opening cleared it without moving. High score {n} needs moves before the rounds change.'),

      '<b>意愿只看走路距离。</b>从屋苑沿道路走到站：站在门口 100%，每多 1 格少 10%（1 格 90%，2 格 80%……）。每轮里正好这个比例的人会出门去站，其余的人直接开车。',
      '<b>Willingness depends only on the walk.</b> Along the roads from the estate to the stop: at the door 100%, each extra block 10% less (1 block 90%, 2 blocks 80%…). Exactly that share of each round goes to the stop; the rest drive.'),
    'i.r3':L('<b>定時發車。</b>每座站的班距＝{base} 秒＋到港鐵的道路格數×{step} 秒。車在站內上客，倒數到零才開；每班 {seats} 座，另有 {queue} 個排隊位。巴士每格行駛 10 秒，到港鐵下車才算送達。',
      '<b>定时发车。</b>每座站的班距＝{base} 秒＋到港铁的道路格数×{step} 秒。车在站内上客，倒数到零才开；每班 {seats} 座，另有 {queue} 个排队位。巴士每格行驶 10 秒，到港铁下车才算送达。',
      '<b>Buses on a timetable.</b> Each stop’s headway = {base} s + {step} s per road block to the MTR. Buses load at the stop and leave when the countdown hits zero; {seats} seats, plus {queue} queue places. Buses take 10 s a block; people count when they step off at the MTR.'),
    'i.r5':L('<b>挪站與冷卻。</b>開局後一共 {moves} 次。挪完冷卻 {cool} 秒：期間不上客，班車照原來的時刻表開（空車）。還在站上的人就近換站，或走回家再考慮；已開出的巴士照常送達。暫停時挪的站可以按「撤銷挪站」退回，次數也退回。',
      '<b>挪站与冷却。</b>开局后一共 {moves} 次。挪完冷却 {cool} 秒：期间不上客，班车照原来的时刻表开（空车）。还在站上的人就近换站，或走回家再考虑；已开出的巴士照常送达。暂停时挪的站可以按「撤销挪站」退回，次数也退回。',
      '<b>Moving and cooling down.</b> {moves} moves after the start. A moved stop cools down for {cool} s: no boarding, buses keep their timetable (empty). People waiting there try the nearest other stop or walk home; buses already out still deliver. Moves made while paused can be undone with “Undo moves”, and you get them back.'),
    'i.r6':L('<b>潮汐表。</b>{n} 輪，每輪 2 分鐘。每輪各區的人在整輪裡陸續出門（不是一下子湧出），所以一輪快結束時站上也有人在用——太早挪會丟掉這些人。每輪開始前 3 秒倒數。',
      '<b>潮汐表。</b>{n} 轮，每轮 2 分钟。每轮各区的人在整轮里陆续出门（不是一下子涌出），所以一轮快结束时站上也有人在用——太早挪会丢掉这些人。每轮开始前 3 秒倒数。',
      '<b>Tide table.</b> {n} rounds of 2 minutes. In each round people leave home steadily through the whole round (not in a burst), so stops are still in use near the end of a round — move too early and you lose them. A 3-second countdown before each round.'),
    'src.l1':L('示意關卡，不是真實地點：四個屋苑在一條環路的四角，港鐵站在下方遠處，下面兩個屋苑離港鐵較近。','示意关卡，不是真实地点：四个屋苑在一条环路的四角，港铁站在下方远处，下面两个屋苑离港铁较近。','A practice board, not a real place: four estates on the corners of a loop road, the station far below; the lower two are nearer the station.'),
    'src.l2':L('示意關卡，不是真實地點：一條河隔開北岸三個屋苑和港鐵站，只有兩座橋。中岸看起來就在港鐵正上方，實際要繞橋。','示意关卡，不是真实地点：一条河隔开北岸三个屋苑和港铁站，只有两座桥。中岸看起来就在港铁正上方，实际要绕桥。','A practice board, not a real place: a river with two bridges separates three estates from the station. Middle Bank looks right above the station but must go round by a bridge.'),
    'src.demand':L('每輪各區人數由幾個固定數值輪換，兩輪換一次；人數與時間都是遊戲設定，不代表真實客流或減碳量。','每轮各区人数由几个固定数值轮换，两轮换一次；人数与时间都是游戏设定，不代表真实客流或减碳量。','Each round’s numbers swap a few fixed values between estates, changing every two rounds; numbers and times are game settings, not real ridership or carbon savings.')
