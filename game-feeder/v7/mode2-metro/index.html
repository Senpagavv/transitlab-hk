<!doctype html>
<html lang="zh-Hant" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TransitLab HK · 模式 2 · 地鐵</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/style.css"><link rel="stylesheet" href="metro.css"></head><body class="entered">

<header id="topbar">
  <div class="brand"><img class="brandlogo" src="../shared/logo-tide.svg" alt="TransitLab" width="22" height="22"><span class="wm">TransitLab</span><span class="sub" data-i18n="brand.sub">HK · Feeder bus · 接駁巴士</span></div>
  <div class="sp"></div>
  <button class="btn btn-sm" id="help" data-i18n-html="top.rules">Rules <span class="tc">規則</span></button>
  <div class="seg lang" id="langSeg" role="group" data-i18n-aria="top.lang"><button data-lang="zh-Hant" aria-pressed="true">繁</button><button data-lang="zh-Hans" aria-pressed="false">简</button><button data-lang="en" aria-pressed="false">EN</button></div>
  <div class="seg" role="group" data-i18n-aria="top.theme"><button id="thPaper" aria-pressed="true">☀</button><button id="thInk" aria-pressed="false">☾</button></div>
</header>

<main id="app" class="eg">
  <aside class="side scol">
    <div class="row"><a class="btn btn-sm" href="../index.html" id="backHub" data-i18n="m.back">← 五個模式</a><button class="btn btn-sm" id="lvInfo" data-i18n="g.lvInfo">本關</button><span class="lbl" data-i18n="m.mode">Mode 02 · 地鐵</span></div>
    <h1 class="h1"><span id="titleEn">The metro</span><span class="h1tc" id="titleTc">新界西北 · 東西線</span></h1>
    <p class="lede" data-i18n-html="m.lede"></p>

    <div class="box goal">
      <div class="row"><span class="lbl" data-i18n="g.goalLbl">Goal · 目標</span><div class="sp"></div><span class="mono goalnum"><b id="score2">0</b> / <span id="totalN">0</span></span></div>
      <div class="gauge" aria-hidden="true"><i id="scoreBar"></i><em id="tickPass"></em><em id="tickHigh"></em><em id="tickMaster"></em></div>
      <div class="note" id="goal"></div>
    </div>

    <div class="row controls">
      <button class="btn btn-p" id="start" disabled>▶</button>
      <div class="seg" id="speedSeg" role="group"><button data-sp="1" aria-pressed="true">1×</button><button data-sp="2" aria-pressed="false">2×</button><button data-sp="4" aria-pressed="false">4×</button></div><span class="fasthint" id="fastHint" data-i18n="g.fast">按住 F 快進</span>
      <button class="btn btn-sm" id="reset">↺</button>
    </div>

    <div class="box mbox" id="buildBox"></div>
    <div class="box mbox" id="trainBox"></div>

    <div class="lbl" style="margin-top:16px" data-i18n="m.rulesH">Four rules · 四條規則</div>
    <ol class="mini">
      <li data-i18n-html="m.rule1"></li>
      <li data-i18n-html="m.rule2"></li>
      <li id="rule3"></li>
      <li data-i18n-html="m.rule4"></li>
    </ol>
    <div class="legend" id="legend"></div>
  </aside>

  <div class="play">
    <div class="mapplate">
      <svg id="board" viewBox="0 0 1060 600" role="group"></svg>
      <div class="clockbox ov"><div class="c" id="clock">00:00</div><div class="u" id="wave"></div><div class="prog"><i id="clockProg"></i></div></div>
      <div class="countdown" id="cdown" aria-live="polite"><b id="cdNum">7</b><span id="cdText"></span><small id="cdHint"></small></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="hud">
        <div class="good" id="hudGood"><b id="score">0</b><small data-i18n="m.hudGood">By metro · 坐地鐵到達</small></div>
        <div><b id="onway">0</b><small data-i18n="m.hudWay">On the way · 路上</small></div>
        <div class="bad" id="hudBad"><b id="cars">0</b><small data-i18n="m.hudBad">Drove · 開車</small></div>
        <div><b id="walked">0</b><small data-i18n="m.hudWalk">Walked · 走路就到</small></div>
      </div>
    </div>
  </div>

  <aside class="side right scol">
    <div class="row"><span class="lbl" data-i18n="m.weeksH">Weeks · 每週</span><div class="sp"></div><span class="chip"><i></i><span id="weeksChip"></span></span></div>
    <table id="weeks"></table>
    <div class="lbl" style="margin-top:16px" data-i18n="m.habitH">Habit · 坐地鐵習慣</div>
    <div class="box habit" id="habitBox"></div>
    <div class="lbl" style="margin-top:16px" data-i18n="g.log">Dispatch log · 調度提示</div>
    <p id="notice" class="note" role="status" aria-live="polite"></p>
  </aside>
</main>

<dialog id="info"><button class="close" data-close="info">×</button>
<span class="lbl" data-i18n="i.lbl">Rules · 規則</span><h2 class="h1" data-i18n="m.infoH">地鐵模式的規則</h2>
<div id="infoBody"></div></dialog>

<dialog id="result"><span class="lbl" id="resultEn"></span><h2 class="h1" id="resultTitle"></h2><p id="resultScore" class="mono"></p>
<div id="resultBody"></div><p id="resultHint" class="note"></p>
<div class="row"><button id="again" class="btn btn-p" data-i18n="r.again">再試一局 ↺</button><button data-close="result" class="btn" data-i18n="r.board">查看棋盤</button></div></dialog>

<dialog id="lvIntro" class="intro"><span class="lbl">MODE 02 · THE METRO</span><h2 class="h1" id="ivTitle"></h2>
<p class="ivnew"><span class="tag" data-i18n="iv.new">這一關多了</span><span id="ivNew"></span></p><ul class="ivlist" id="ivBody"></ul><p class="note ivcourse" id="ivCourse"></p>
<div class="row"><button class="btn btn-p" id="ivGo" data-i18n="iv.go">開始佈置 →</button></div></dialog>

<script src="data.js"></script><script src="engine.js"></script><script src="../shared/i18n.js"></script><script src="strings.js"></script><script src="ui.js"></script></body></html>
