<!doctype html>
<html lang="zh-Hant" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TransitLab HK · 五個模式</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css">
<style>
  /* v7 hub: v3's cover and dot map (shared/style.css has its styles); levels locked until the one before is passed */
  .hub-panel .lv.locked{opacity:.55}
  .hub-panel .lv.locked .lv-m{color:var(--s-ink3)}
  /* the level's page opens after the board is built: fade to paper */
  body::after{content:'';position:fixed;inset:0;background:var(--s-paper);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:200}
  body.veil::after{opacity:1}
</style></head><body class="inhub chrome-off">
<header id="topbar">
  <div class="brand"><img class="brandlogo" src="shared/logo-tide.svg" alt="TransitLab" width="22" height="22"><span class="wm">TransitLab</span><span class="sub" data-i18n="brand.sub">HK · 交通遊戲 · 五個模式</span></div>
  <div class="sp"></div>
  <div class="seg lang" id="langSeg" role="group" data-i18n-aria="top.lang"><button data-lang="zh-Hant" title="繁體中文" aria-pressed="true">繁</button><button data-lang="zh-Hans" title="简体中文" aria-pressed="false">简</button><button data-lang="en" title="English" aria-pressed="false">EN</button></div>
  <div class="seg" role="group" data-i18n-aria="top.theme"><button id="thPaper" aria-pressed="true" data-i18n-title="top.paper">☀</button><button id="thInk" aria-pressed="false" data-i18n-title="top.ink">☾</button></div>
</header>
<nav id="navrow"></nav>
<!-- The hub: the opening (title + tide bar) and, after a scroll, the map every mode starts from. -->
<div id="hub" data-i18n-aria="hub.aria">
  <div class="cv-stage"><canvas id="cvDots"></canvas><div class="tip" id="cvTip"></div></div>
  <div class="hub-marks" id="hubMarks"></div>
  <aside class="hub-panel" id="hubPanel"></aside>
  <div class="cv-copy" id="cvCopy">
    <img class="cv-logo" src="shared/logo-tide.svg" alt="TransitLab · Green Genre" width="68" height="68">
    <h1 class="cv-title">This city tides<br><em>twice</em> a day<span class="cv-tc" data-i18n="cv.titleTc">這座城市，一天漲潮兩次</span></h1>
    <p class="cv-lede">761 trunk-road detectors, 24 weekdays, one reading every hour.<span class="cv-tc" data-i18n="cv.ledeTc">運輸署實測，逐小時。</span></p>
    <p class="cv-mode"><span class="lbl">Five modes</span><span data-i18n="cv.mode">五個模式：車站與步行 · 地鐵 · 路會塞 · 站旁開發 · 沙盤</span></p>
  </div>
  <button class="cv-hint" id="cvHint"><i class="mouse" aria-hidden="true"></i><span data-i18n="cv.scroll">向下滾動，打開地圖</span></button>
  <footer class="cv-bar">
    <button class="cv-play" id="cvPlay" data-i18n-title="cv.replay" data-i18n-aria="cv.replay"><svg width="13" height="14" viewBox="0 0 11 12" fill="currentColor"><path d="M1 0.6 10 6 1 11.4z"/></svg></button>
    <div class="cv-hour"><div class="h" id="cvHour">03:00</div><div class="u" id="cvPhase">trough</div></div>
    <div class="cv-mid"><svg id="cvTide"></svg></div>
    <div class="cv-nums"><div><b id="cvFlow">—</b><span>veh/h</span></div><div><b id="cvSpeed">—</b><span>km/h</span></div></div>
  </footer>
</div>

<script src="shared/i18n.js"></script><script src="levels/registry.js"></script><script src="shared/progress.js"></script><script src="shared/save.js"></script><script src="hub/stations.js"></script><script src="hub/cover-data.js"></script><script src="hub/strings.js"></script><script src="hub/hub.js"></script>
</body></html>
