    'cd.habit':L('第 {n} 天過去：習慣 {a}% → {b}%','第 {n} 天过去：习惯 {a}% → {b}%','Day {n} over: habit {a}% → {b}%'),
    'n.start':L('開始了。每一輪的人都有結果後，遊戲停 7 秒顯示下一輪；想慢慢調，就在那時按空格暫停。','开始了。每一轮的人都有结果后，游戏停 7 秒显示下一轮；想慢慢调，就在那时按空格暂停。','Running. When a round has settled the game stops for 7 s to show the next one; press Space then to adjust at leisure.'),
    'iv.new':L('這一關多了','这一关多了','New here'),'iv.go':L('開始佈置 →','开始布置 →','Set up →'),
    'iv.l1.new':L('<b>分流</b>：人按吸引力分去各站，站會爆。','<b>分流</b>：人按吸引力分去各站，站会爆。','<b>Shares</b>: people split between stops by pull, and stops can overflow.'),
    'iv.l1.body':L('<li>四個屋苑的人都想坐巴士去元朗市中心。站在屋苑門口吸引力 100%，每多走 1 格少 10%，6 格以外沒人來。</li><li>兩座站一個 80%、一個 40%，這個屋苑的人就按 2 : 1 分過去。滑過 ＋ 就看到它對每個屋苑的吸引力。</li><li>每班 8 座、站上最多再排 8 人。<b>屋苑的綠圈補滿、站別冒紅光</b>，就是好擺法。</li><li>擺好三座站就按開始；每輪的人都有結果後停 7 秒，這時可以隨便挪站。</li>',
      '<li>四个屋苑的人都想坐巴士去元朗市中心。站在屋苑门口吸引力 100%，每多走 1 格少 10%，6 格以外没人来。</li><li>两座站一个 80%、一个 40%，这个屋苑的人就按 2 : 1 分过去。滑过 ＋ 就看到它对每个屋苑的吸引力。</li><li>每班 8 座、站上最多再排 8 人。<b>屋苑的绿圈补满、站别冒红光</b>，就是好摆法。</li><li>摆好三座站就按开始；每轮的人都有结果后停 7 秒，这时可以随便挪站。</li>',
      '<li>Everyone in the four estates wants a bus to Yuen Long town centre. A stop at the door pulls 100%, each extra block 10% less, nobody beyond 6 blocks.</li><li>With one stop at 80% and one at 40%, the estate splits 2 : 1. Hover a ＋ to see its pull on each estate.</li><li>8 seats a bus, at most 8 more queuing. <b>Close the green rings round the estates and keep the stops from glowing red.</b></li><li>Place three stops and press Start; after each round the game stops 7 s and you can move stops freely.</li>'),
    'iv.l1.course':L('課程連結：出行分佈——距離越遠，吸引越弱（重力模型的「距離衰減」）。','课程链接：出行分布——距离越远，吸引越弱（重力模型的「距离衰减」）。','Course link: trip distribution — the farther, the weaker the pull (distance decay in the gravity model).'),
    'iv.l2.new':L('<b>人多的地方會換</b>：每輪兩個屋苑特別多人，下一輪換別的。','<b>人多的地方会换</b>：每轮两个屋苑特别多人，下一轮换别的。','<b>The busy places change</b>: two estates are busy each round, others the next.'),
    'iv.l2.body':L('<li>四輪，每輪人多的屋苑不一樣——第一輪合適的擺法，第二輪可能就爆。</li><li>兩輪之間停 7 秒：看潮汐表和圓圈，隨便挪站，不扣次數（挪過的站冷卻 20 秒）。</li><li>輪中間也能挪，但要用掉 1 次「機動」。</li>',
      '<li>四轮，每轮人多的屋苑不一样——第一轮合适的摆法，第二轮可能就爆。</li><li>两轮之间停 7 秒：看潮汐表和圆圈，随便挪站，不扣次数（挪过的站冷却 20 秒）。</li><li>轮中间也能挪，但要用掉 1 次「机动」。</li>',
      '<li>Four rounds; the busy estates change each round — a layout that suits round 1 may overflow in round 2.</li><li>Between rounds the game stops 7 s: read the tide table and the rings, move stops freely (a moved stop cools down 20 s).</li><li>You can move during a round too, but it uses your one extra move.</li>'),
    'iv.l2.course':L('課程連結：需求隨時間變——服務要跟著高峰走（公共交通的營運調度）。','课程链接：需求随时间变——服务要跟着高峰走（公共交通的营运调度）。','Course link: demand changes over time — service has to follow the peaks (public transport operations).'),
    'iv.l3.new':L('<b>五個屋苑，只有三座站</b>。','<b>五个屋苑，只有三座站</b>。','<b>Five estates, three stops</b>.'),
    'iv.l3.body':L('<li>五個屋苑散在聯和墟東面，三座站一定有屋苑要共用。</li><li>班次更密（到終點每格只加 5 秒），人也更多：找相鄰屋苑能共用、又不會爆的位置。</li><li>高峰在屋苑之間輪流：開局擺好大方向，再在兩輪之間微調。</li>',
      '<li>五个屋苑散在联和墟东面，三座站一定有屋苑要共用。</li><li>班次更密（到终点每格只加 5 秒），人也更多：找相邻屋苑能共用、又不会爆的位置。</li><li>高峰在屋苑之间轮流：开局摆好大方向，再在两轮之间微调。</li>',
      '<li>Five estates spread east of Luen Wo Hui: with three stops, some estates must share.</li><li>Buses come more often (only 5 s more per block), but there are more people: find spots two neighbours can share without overflowing.</li><li>Peaks move between estates: set the broad layout first, then fine-tune between rounds.</li>'),
    'iv.l3.course':L('課程連結：站點選址——覆蓋多少人、容量夠不夠，兩者要取捨（網絡規劃）。','课程链接：站点选址——覆盖多少人、容量够不够，两者要取舍（网络规划）。','Course link: siting stops — coverage against capacity (network planning).'),
    'iv.l4.new':L('<b>不同的人</b>：長者、學生、上班族，各有各的限制。','<b>不同的人</b>：长者、学生、上班族，各有各的限制。','<b>Different people</b>: elders, students and workers, each with their own limits.'),
    'iv.l4.body':L('<li class="nb"><b>● 長者</b>走得慢，最多走 2 格。</li><li class="nb"><b>▲ 學生</b>要在出門後 {bell} 秒內上車，排隊也算時間——站一爆就遲到。</li><li class="nb"><b>■ 上班族</b>班次比 {hw} 秒一班疏就不等：站要在離大埔墟 3 格以內。</li><li>四輪是早上四個時段：07:00 學生和上班族、08:00 上班高峰、09:00 開始有長者、10:00 大多是長者。每個屋苑的人口組成來自 2026 年分區資料。</li>',
      '<li class="nb"><b>● 长者</b>走得慢，最多走 2 格。</li><li class="nb"><b>▲ 学生</b>要在出门后 {bell} 秒内上车，排队也算时间——站一爆就迟到。</li><li class="nb"><b>■ 上班族</b>班次比 {hw} 秒一班疏就不等：站要在离大埔墟 3 格以内。</li><li>四轮是早上四个时段：07:00 学生和上班族、08:00 上班高峰、09:00 开始有长者、10:00 大多是长者。每个屋苑的人口组成来自 2026 年分区资料。</li>',
      '<li class="nb"><b>● Elders</b> walk slowly, 2 blocks at most.</li><li class="nb"><b>▲ Students</b> must board within {bell} s of leaving home, queuing included — an overflowing stop makes them late.</li><li class="nb"><b>■ Workers</b> won’t wait for buses less frequent than every {hw} s: their stops must be within 3 blocks of Tai Po Market.</li><li>The four rounds are four times of the morning: 07:00 students and workers, 08:00 the work peak, 09:00 the first elders, 10:00 mostly elders. Each estate’s mix is from the 2026 zone data.</li>'),
    'iv.l4.course':L('課程連結：市場細分——不同人群的出行特性不同；評估方案要問「誰得益、誰付出」（交通影響評估）。','课程链接：市场细分——不同人群的出行特性不同；评估方案要问「谁得益、谁付出」（交通影响评估）。','Course link: market segmentation — groups travel differently; appraising a scheme asks who gains and who pays (traffic impact assessment).')
  });
  // v7 · mode 1 «車站與步行»: level names 1-1 … 1-4, and the teaching level's one-line tips (shared/tips.js)
  I18N.add({
    'doc.title':L('TransitLab HK · 模式 1 · 車站與步行','TransitLab HK · 模式 1 · 车站与步行','TransitLab HK · Mode 1 · Stations and walking'),
    'g.mode':L('Mode 01 · 車站與步行','Mode 01 · 车站与步行','Mode 01 · Stations and walking'),
    'g.l1':L('1-1 引導','1-1 引导','1-1 Intro'),'g.l2':L('1-2','1-2','1-2'),'g.l3':L('1-3 難','1-3 难','1-3 Hard'),'g.l4':L('1-4 人群','1-4 人群','1-4 People'),
    'site.l1':L('1-1 · 朗屏（引導）','1-1 · 朗屏（引导）','1-1 · Long Ping (intro)'),'site.l2':L('1-2 · 元朗南','1-2 · 元朗南','1-2 · Yuen Long South'),
    'site.l3':L('1-3 · 粉嶺','1-3 · 粉岭','1-3 · Fanling'),'site.l4':L('1-4 · 大埔墟 · 不同的人','1-4 · 大埔墟 · 不同的人','1-4 · Tai Po Market · different people'),
    'tip.ok':L('知道了','知道了','Got it'),'tip.off':L('不再提示','不再提示','No more tips'),
    'tip.start':L('先放 A 站：停在任何一個 ＋ 上，會看到這個位置對每個屋苑的吸引力——離屋苑越近越高。','先放 A 站：停在任何一个 ＋ 上，会看到这个位置对每个屋苑的吸引力——离屋苑越近越高。',
      'Place stop A first: hover any ＋ to see how strongly that spot pulls each estate — the nearer, the stronger.'),
    'tip.placed':L('三座站都放好了。屋苑的綠圈＝這一輪接得走的人，缺口就是接不走的；站周圍的暖光越濃越滿。把綠圈補滿、別讓站發紅，再按「開始」。','三座站都放好了。屋苑的绿圈＝这一轮接得走的人，缺口就是接不走的；站周围的暖光越浓越满。把绿圈补满、别让站发红，再按「开始」。',
      'All three stops placed. The green ring round an estate = people who get a place this round (a gap = left out); the warm glow round a stop = how full it gets. Close the rings, keep the stops from glowing red, then press Start.'),
    'tip.full':L('這座站滿了：再來的人會改去別的站，附近都滿就回家、最後開車。到了停頓，把它的人分一部分給旁邊的站。','这座站满了：再来的人会改去别的站，附近都满就回家、最后开车。到了停顿，把它的人分一部分给旁边的站。',
      'This stop is full: newcomers try another stop, or go home and finally drive. In the next break, give part of its people to a neighbour.'),
    'tip.break':L('兩輪之間的停頓：地圖顯示下一輪。這時候可以隨便挪站，不扣次數；按空格可以停下來慢慢想。','两轮之间的停顿：地图显示下一轮。这时候可以随便挪站，不扣次数；按空格可以停下来慢慢想。',
      'The break between rounds: the map shows the next round. Move stops freely now, no count; press Space to stop and think.')
  });
  I18N.add({'m.back':L('← 五個模式','← 五个模式','← Five modes')});   // back to the hub (also in shared/nav.js)
  if(typeof document!=='undefined')I18N.apply();
})();

</script><script>
(()=>{
  'use strict';
  // v4 level editor. Draw a board (roads, river, estates, the MTR station, the spots where a stop may go), set the
  // numbers of the round rules and the people per round, let the bots measure it, then test-play it in the game page.
  // The level is a plain object (same fields as a level in data.js; water as a list of cells). It is saved in this
  // browser on every change and can be exported to / imported from a .json file.
  const {D,P}=Tide,$=id=>document.getElementById(id),I=window.I18N,t=(k,v)=>I.t(k,v);
  const SAVE='tl-v7m1-editor',LEVEL='tl-v7m1-level',GW=72,GH=62,MX=110,MY=90;
  const HOUSE={left:[-50,0],right:[50,0],up:[0,-56],down:[0,56]};
  const k=c=>c.join(','),un=s=>s.split(',').map(Number);
  // the page that plays a level: the source pages or the bundled single files, side by side in one folder
  const here=decodeURIComponent(location.pathname.split('/').pop()||'');
  const GAME=here==='模式1-关卡编辑器.html'?'模式1-车站与步行.html':'index.html';
  $('edToGame').href=GAME;
  if(here==='关卡编辑器.html'||here==='模式1-关卡编辑器.html')for(const n of [2,3,4])$('edOther'+n).href='../editor/'+encodeURIComponent('关卡编辑器.html')+'#mode='+n;

  /* ------------------------------------------------------------------ the level */
  function blank(){return{v:4,title:'',cols:12,rows:8,roads:[],waterCells:[],hub:null,candidates:[],estates:[],
    rounds:4,hold:1,phases:[],firstWave:20,interval:120,release:110,headway:[40,4],seats:8,queue:8,cool:20,moves:1,
    patience:210,willing:[100,90,80,70,60,50,40],tiers:[0,0,0],meta:blankMeta()};}
  // the level's facts for the tl-level/1 file (levels/README.md), as in the editor for modes 2–4 (2026-10-15)
  function blankMeta(){return{key:'',order:2,challenge:false,titleHans:'',titleEn:'',story:['',''],station:'',author:'',source:''};}
  // a built-in level as an editor level
  function fromLevel(L,title){
    const water=[];for(const [x1,y1,x2,y2] of L.water||[])for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)water.push([x,y]);
    const hold=L.waves.length>1&&L.waves.every((w,i)=>k(w)===k(L.waves[i-i%2]))?2:1;
    const side=h=>h[0]<0?'left':h[0]>0?'right':h[1]<0?'up':'down';
    return{...blank(),title,cols:L.cols,rows:L.rows,roads:L.roads.map(c=>c.slice()),waterCells:water,hub:L.hub.slice(),
      candidates:L.candidates.map(c=>c.slice()),estates:L.estates.map(e=>({name:e.name,cell:e.cell.slice(),side:side(e.house||[0,40])})),
      rounds:L.waves.length,hold,phases:L.waves.filter((w,i)=>i%hold===0).map(w=>w.slice()),
      firstWave:L.firstWave??20,interval:L.interval??120,release:L.release??110,headway:L.headway.slice(),seats:L.seats??8,
      queue:L.queue??8,cool:L.cool??20,moves:L.moves??1,patience:L.patience??210,
      willing:(L.willing||[1,.9,.8,.7,.6,.5,.4]).map(w=>Math.round(w*100)),tiers:(L.tiers||[0,0,0]).slice()};}
  const waves=lv=>Array.from({length:lv.rounds},(_,r)=>(lv.phases[Math.floor(r/lv.hold)]||lv.phases.at(-1)||[]).slice(0,lv.estates.length));
  // what the game reads
  function toLevel(lv){
    return{v:4,title:lv.title,cols:lv.cols,rows:lv.rows,roads:lv.roads,waterCells:lv.waterCells,hub:lv.hub,candidates:lv.candidates,
      estates:lv.estates.map(e=>({name:e.name,hans:e.name,cell:e.cell,house:HOUSE[e.side]||HOUSE.down})),waves:waves(lv),
      firstWave:lv.firstWave,interval:lv.interval,release:Math.min(lv.release,lv.interval),headway:lv.headway,seats:lv.seats,queue:lv.queue,
      cool:lv.cool,moves:lv.moves,patience:lv.patience,willing:lv.willing.map(w=>w/100),tiers:lv.tiers,
      margin:[MX,MY],hubLabel:lv.hub&&lv.hub[0]>=lv.cols-3?'left':'right'};
  }
  let lv=load();
  function load(){try{const s=localStorage.getItem(SAVE);if(s)return{...blank(),...JSON.parse(s)};}catch(e){}return fromLevel(D.example('l1'),'');}
  function save(){try{localStorage.setItem(SAVE,JSON.stringify(lv));}catch(e){}}
  function changed(){fixPhases();save();analysis=null;render();}
  // the people table always has one row per phase and one column per estate
  function fixPhases(){
    const n=Math.max(1,Math.ceil(lv.rounds/lv.hold));
    while(lv.phases.length<n)lv.phases.push(lv.phases.length?lv.phases.at(-1).slice():[]);
    lv.phases.length=n;
    for(const ph of lv.phases){while(ph.length<lv.estates.length)ph.push(3);ph.length=lv.estates.length;}
  }

  /* ----------------------------------------------------------------- checking */
  const has=(list,c)=>list.some(x=>k(x)===k(c));
  function problems(){
    const out=[],roads=new Set(lv.roads.map(k));
    if(!lv.hub)out.push(t('ed.pNoHub'));else if(!roads.has(k(lv.hub)))out.push(t('ed.pHubOff'));
    if(!lv.estates.length)out.push(t('ed.pNoEstate'));
    if(lv.candidates.length<3)out.push(t('ed.pFewCand'));
    for(const e of lv.estates)if(!roads.has(k(e.cell)))out.push(t('ed.pEstateOff',{s:e.name}));
    if(lv.hub&&roads.has(k(lv.hub))){
      const d=reach(lv.hub);
      for(const e of lv.estates)if(roads.has(k(e.cell))&&!d.has(k(e.cell)))out.push(t('ed.pNoPath',{s:e.name}));
      for(const c of lv.candidates)if(!d.has(k(c))){out.push(t('ed.pCandCut'));break;}}
    if(!waves(lv).flat().some(n=>n>0))out.push(t('ed.pNoPeople'));
    return out;
  }
  // road blocks from a cell to every road cell (the game's own distance)
  function reach(from){
    const roads=new Set(lv.roads.map(k)),d=new Map([[k(from),0]]),q=[from];
    for(let i=0;i<q.length;i++){const c=q[i];for(const n of [[c[0]+1,c[1]],[c[0]-1,c[1]],[c[0],c[1]+1],[c[0],c[1]-1]])
      if(roads.has(k(n))&&!d.has(k(n))){d.set(k(n),d.get(k(c))+1);q.push(n);}}
    return d;
  }

  /* ------------------------------------------------------------------- drawing */
  let tool='road',hover=null,selEstate=-1;
  const xy=c=>[MX+c[0]*GW,MY+c[1]*GH];
  const svg=(tag,a,inner='')=>`<${tag} ${Object.entries(a).map(([x,v])=>`${x}="${v}"`).join(' ')}>${inner}</${tag}>`;
  const tok=n=>getComputedStyle(document.documentElement).getPropertyValue('--s-'+n).trim();
  function drawBoard(){
    const W=MX*2+(lv.cols-1)*GW,H=MY*2+(lv.rows-1)*GH,C={road:tok('road'),edge:tok('road-edge'),ink:tok('ink'),ink2:tok('ink2'),ink3:tok('ink3'),
      paper:tok('paper'),panel:tok('panel'),accent:tok('accent'),info:tok('info'),warn:tok('warn'),line:tok('line2')};
    $('edBoard').setAttribute('viewBox',`0 0 ${W} ${H}`);
    let out='';
    for(let x=0;x<lv.cols;x++)for(let y=0;y<lv.rows;y++){const [px,py]=xy([x,y]);out+=svg('circle',{cx:px,cy:py,r:2.2,fill:C.line});}
    for(const c of lv.waterCells){const [x,y]=xy(c);out+=svg('rect',{x:x-GW/2,y:y-GH/2,width:GW,height:GH,fill:C.info,'fill-opacity':.18});}
    const roads=new Set(lv.roads.map(k));
    for(const [col,w] of [[C.edge,24],[C.road,20]])for(const c of lv.roads){
      const [x,y]=xy(c);out+=svg('rect',{x:x-w/2,y:y-w/2,width:w,height:w,fill:col});
      for(const n of [[c[0]+1,c[1]],[c[0],c[1]+1]])if(roads.has(k(n))){const [x2,y2]=xy(n);out+=svg('path',{d:`M${x} ${y}L${x2} ${y2}`,stroke:col,'stroke-width':w});}}
    for(const c of lv.waterCells)if(roads.has(k(c))){const [x,y]=xy(c),v=roads.has(k([c[0],c[1]-1]))||roads.has(k([c[0],c[1]+1]));
      for(const d of [-14,14])out+=v?svg('path',{d:`M${x+d} ${y-24}L${x+d} ${y+24}`,stroke:C.ink2,'stroke-width':2.2}):svg('path',{d:`M${x-30} ${y+d}L${x+30} ${y+d}`,stroke:C.ink2,'stroke-width':2.2});}
    for(const c of lv.candidates){const [x,y]=xy(c);out+=svg('circle',{cx:x,cy:y,r:11,fill:C.panel,stroke:C.ink3,'stroke-width':1.3})+svg('text',{x,y:y+5,'font-size':15,fill:C.ink3,'text-anchor':'middle'},'＋');}

  function run(a,b){const out=[];let [x,y]=a;out.push([x,y]);while(x!==b[0]){x+=Math.sign(b[0]-x);out.push([x,y]);}while(y!==b[1]){y+=Math.sign(b[1]-y);out.push([x,y]);}return out;}

      for(const d of last?run(last,c):[c])if(!has(list,d))list.push(d);

    // dragging the eraser clears roads, water and stop spots, but steps round estates and the station (click those)
    if(tool==='erase'&&!first){for(const d of last?run(last,c):[c]){if(lv.estates.some(e=>k(e.cell)===k(d))||lv.hub&&k(lv.hub)===k(d))continue;

  /* ----------------------------------------------------------- bots, in the page */
  // The same checks as bots/v5_tune.js, smaller: every opening without moving, then from the best three openings a
  // player who moves one stop at most in each break between rounds. Runs in slices so the page stays usable.
  // A move {r,id,to} is made in the break before round r (0-based); with mid, that many seconds into round r-1 instead.
  let analysis=null,busy=false;
  const tick=()=>new Promise(r=>setTimeout(r,0));
  function playLevel(open,moves=[],mid=0){const g=new Tide.Game();open.forEach((c,id)=>g.place(id,D.candidates[c]));g.start();
    for(const m of [...moves].sort((a,b)=>a.r-b.r)){if(mid){g.runTo(m.r-1);g.advance(mid);}else g.runTo(m.r);g.place(m.id,D.candidates[m.to]);}
    g.advance(P.duration+1);return g.delivered;}
  async function analyse(){
    if(busy||problems().length)return;busy=true;analysis={progress:0};render();
    D.loadEditor(toLevel(lv));Tide.reset();
    const n=D.candidates.length,all=[];for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++)all.push([a,b,c]);
    const LIMIT=1200,step=Math.max(1,all.length/LIMIT),opens=all.length>LIMIT?Array.from({length:LIMIT},(_,i)=>all[Math.floor(i*step)]):all;
    const total=D.waves.flat().reduce((x,y)=>x+y,0),rounds=D.waves.length;
    const plannerWork=3*(rounds-1)*3*n,work=opens.length+plannerWork;let done=0;
    const statics=[];
    for(let i=0;i<opens.length;i++){statics.push({o:opens[i],s:playLevel(opens[i])});done++;if(i%6===5){analysis.progress=done/work;renderAnalysis();await tick();}}
    statics.sort((a,b)=>b.s-a.s);
    let best={score:statics[0].s,moves:[],open:statics[0].o};
    for(const x of statics.slice(0,3)){
      const moves=[],cells=x.o.slice();let score=x.s;

          const s=playLevel(x.o,[...moves,{r,id,to}]);if(s>score&&(!pick||s>pick.s))pick={s,m:{r,id,to}};}
        done+=3*n;analysis.progress=Math.min(1,done/work);renderAnalysis();await tick();
        if(pick){moves.push(pick.m);cells[pick.m.id]=pick.m.to;score=pick.s;}}

    const S=statics[0].s,B=best.score,sc=statics.map(x=>x.s);

    const early=best.moves.length?playLevel(best.open,best.moves,60):null;
    const pass=sc[Math.min(4,sc.length-1)],high=Math.max(S+1,S+Math.round((B-S)/2)),master=B-S>=3?B-1:B;
    analysis={total,openings:sc.length,sampled:all.length>LIMIT?all.length:0,staticBest:S,early,median:sc[Math.floor(sc.length/2)],passCount:sc.filter(s=>s>=pass).length,
      planBest:B,plan:best,tiers:[pass,Math.min(high,master),master],
      bestOpen:best.open.map(i=>k(D.candidates[i])),moves:best.moves.map(m=>({r:m.r+1,stop:'ABC'[m.id],to:k(D.candidates[m.to])}))};
    busy=false;render();
  }
  function renderAnalysis(){

      const hant=j.title&&typeof j.title==='object'?j.title['zh-Hant']:j.title||'';
      lv=j.editor?{...blank(),...j.editor}:fromLevel(j.level||j,hant||'');
      if(j.format==='tl-level/1')lv.meta={...blankMeta(),...(lv.meta||{}),key:j.key||'',order:j.order||2,challenge:!!j.challenge,titleHans:(j.title&&j.title['zh-Hans'])||'',titleEn:(j.title&&j.title.en)||'',
        story:(j.story||[]).map(x=>typeof x==='string'?x:x['zh-Hant']||'').concat(['','']).slice(0,2),station:(j.hub&&j.hub.station)||'',author:j.author||'',source:typeof j.source==='string'?j.source:''};
      selEstate=-1;changed();flash(t('ed.imported',{s:f.name}));}
    catch(e){flash(t('ed.badFile'));}$('edFile').value='';};
  $('edExample').onchange=e=>{const v=e.target.value;e.target.value='';if(!v)return;
    if(v==='blank')lv=blank();else{const e=window.TL_LEVELS&&TL_LEVELS.get(1,v);lv=fromLevel(D.example(v),e&&!e.builtin&&e.title?e.title['zh-Hant']||'':t('site.'+v));}
    selEstate=-1;changed();};
  // level files of this mode (levels/m1/*.json) as starting points too; the stations for «which station»
  for(const e of (window.TL_LEVELS?TL_LEVELS.mode(1):[]))if(!e.builtin&&e.level){const o=document.createElement('option');o.value=e.key;o.textContent=e.order+' · '+(e.title['zh-Hant']||e.key);$('edExample').append(o);}
  $('edStations').innerHTML=Object.keys(window.TL_STATIONS||{}).filter(x=>/[\u3400-\u9fff]/.test(x)).map(x=>`<option value="${esc(x)}">`).join('');
  const metaField=(id,f,fn=v=>v)=>$(id).addEventListener('input',()=>{lv.meta=lv.meta||blankMeta();lv.meta[f]=fn($(id).value);save();});
  metaField('edKey','key',v=>v.trim().toLowerCase());metaField('edOrder','order',v=>Math.max(1,Math.round(+v||1)));metaField('edTitleHans','titleHans');metaField('edTitleEn','titleEn');
  metaField('edStation','station',v=>v.trim());metaField('edAuthor','author');metaField('edSource','source');
  for(const j of [0,1])$('edStory'+j).addEventListener('input',()=>{lv.meta=lv.meta||blankMeta();lv.meta.story[j]=$('edStory'+j).value;save();});
  $('edChallenge').onchange=()=>{lv.meta=lv.meta||blankMeta();lv.meta.challenge=$('edChallenge').checked;save();};
  window.addEventListener('tl:lang',render);
  function setTheme(th){document.documentElement.setAttribute('data-theme',th);$('thPaper').setAttribute('aria-pressed',String(th==='light'));$('thInk').setAttribute('aria-pressed',String(th==='dark'));
    try{localStorage.setItem('tl-theme',th);}catch(e){}render();}
  $('thPaper').onclick=()=>setTheme('light');$('thInk').onclick=()=>setTheme('dark');
  try{const th=localStorage.getItem('tl-theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}
  window.TL_EDITOR={pad:[MX,MY],get level(){return lv;},toLevel:()=>toLevel(lv),levelFile:()=>levelFile(),analyse,get analysis(){return analysis;}};
  fixPhases();render();
})();

</script></body></html>
