<!doctype html>
<html lang="zh-Hant" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TransitLab HK · 模式 4 · 地面巴士</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/style.css"><link rel="stylesheet" href="bus.css"></head><body class="entered">

<header id="topbar">
  <div class="brand"><img class="brandlogo" src="../shared/logo-tide.svg" alt="TransitLab" width="22" height="22"><span class="wm">TransitLab</span><span class="sub" data-i18n="brand.sub">HK · Feeder bus · 接駁巴士</span></div>
  <div class="sp"></div>
  <button class="btn btn-sm" id="help" data-i18n-html="top.rules">Rules <span class="tc">規則</span></button>
  <div class="seg lang" id="langSeg" role="group" data-i18n-aria="top.lang"><button data-lang="zh-Hant" aria-pressed="true">繁</button><button data-lang="zh-Hans" aria-pressed="false">简</button><button data-lang="en" aria-pressed="false">EN</button></div>
  <div class="seg" role="group" data-i18n-aria="top.theme"><button id="thPaper" aria-pressed="true">☀</button><button id="thInk" aria-pressed="false">☾</button></div>
</header>

<main id="app" class="eg">
  <aside class="side scol">
    <div class="row"><a class="btn btn-sm" href="../index.html" id="backHub" data-i18n="m.back">← 五個模式</a><button class="btn btn-sm" id="lvInfo" data-i18n="g.lvInfo">本關</button><span class="lbl" data-i18n="b4.mode">Mode 04 · 地面巴士</span></div>
    <h1 class="h1"><span>Buses on the road</span><span class="h1tc" data-i18n="b4.levelTitle">九龍東 · 巴士補上最後一段</span></h1>

    <div class="box bigscore">
      <div class="lbl" data-i18n="b4.scoreLbl">八年少塞</div>
      <div class="row"><b id="score">0</b><span class="unit" data-i18n="b4.scoreUnit">車·格</span></div>
      <div class="gauge" aria-hidden="true"><i id="scoreBar"></i><em id="tickPass"></em><em id="tickHigh"></em><em id="tickMaster"></em></div>
      <div class="note" id="goal"></div>
    </div>

    <div class="box yearbox">
      <div class="row"><b id="yearNum"></b><div class="sp"></div><button class="btn btn-p" id="run"></button></div>
      <div class="ychart" id="yChart"></div>
      <div class="note" id="yNote"></div>
      <div class="row yrow"><button class="btn btn-sm" id="pause"></button><button class="btn btn-sm" id="rewind" data-i18n="m.rewind">↺ 回到規劃</button><button class="btn btn-sm hold" id="hold"></button></div>
    </div>

    <div class="box money" id="planBox">
      <div class="row"><span class="lbl" data-i18n="b4.budgetLbl">每年預算</span><div class="sp"></div><b class="mono" id="money"></b></div>
      <div class="note" id="moneyNote"></div>
      <div class="routes" id="routeSeg"></div>
      <div class="row trainrow"><span id="routeTxt"></span><div class="sp"></div><button class="btn btn-sm" id="busMinus">−</button><button class="btn btn-sm" id="busPlus">＋</button></div>
      <div class="row tools">
        <div class="seg" id="toolSeg" role="group"><button data-tool="draw" aria-pressed="true" data-i18n="b4.toolDraw">✏ 路線</button><button data-tool="stop" aria-pressed="false" data-i18n="b4.toolStop">● 站</button><button data-tool="lane" aria-pressed="false" data-i18n="b4.toolLane">▤ 專線</button></div>
        <button class="btn btn-sm" id="undo" data-i18n="m.undo">↶ 撤銷</button><button class="btn btn-sm" id="clear" data-i18n="b4.clearRoute">清空這條</button>
      </div>
      <p class="hint" id="toolHint"></p>
    </div>

    <details class="rulesd"><summary data-i18n="m.rulesH">How it works · 怎麼算</summary><ol class="mini" id="rules"></ol></details>
  </aside>

  <div class="play">
    <div class="mapplate">
      <svg id="board" viewBox="0 0 1000 620" role="group"><g id="gBase"></g><g id="gDyn"></g><g id="gTop"></g></svg>
      <div class="headline" id="headline" aria-live="polite"><b id="hlMain"></b><span id="hlSub"></span></div>
      <div class="infocard" id="infoCard"></div>
      <div class="maplegend" id="mapLegend"></div>
      <div class="yearcard" id="yearCard" aria-live="polite"></div>
    </div>
  </div>

  <aside class="side right scol">
    <div class="lbl" data-i18n="r3.roadsH">How jammed · 路有多塞</div>
    <div class="box expbox" id="roadBox"></div>
    <div class="lbl" style="margin-top:16px" data-i18n="b4.routesH">Bus routes · 巴士路線</div>
    <div class="box expbox" id="busBox"></div>
    <details class="tripsd"><summary data-i18n="m.tripsH">每條愿望線的算式</summary><table id="trips"></table></details>
  </aside>
</main>

<dialog id="info"><button class="close" data-close="info">×</button>
<span class="lbl" data-i18n="i.lbl">Rules · 規則</span><h2 class="h1" data-i18n="b4.infoH">地面巴士的規則</h2><div id="infoBody"></div></dialog>

<dialog id="result"><span class="lbl" id="resultEn"></span><h2 class="h1" id="resultTitle"></h2><p id="resultScore" class="mono"></p>
<div id="resultBody"></div><div class="row"><button data-close="result" class="btn btn-p" data-i18n="m.seeBoard">看看地圖</button><button id="again" class="btn" data-i18n="m.rewind">↺ 回到規劃</button></div></dialog>

<dialog id="lvIntro" class="intro"><span class="lbl">MODE 04 · BUSES ON THE ROAD</span><h2 class="h1" data-i18n="b4.levelTitle"></h2>
<p class="ivnew"><span class="tag" data-i18n="iv.new">這一關多了</span><span data-i18n-html="iv.m4.new"></span></p><ul class="ivlist" id="ivBody"></ul><p class="note ivcourse" data-i18n-html="iv.m4.course"></p>
<div class="row"><button class="btn btn-p" id="ivGo" data-i18n="b4.ivGo">開始畫巴士線 →</button></div></dialog>

<script src="data.js"></script><script src="engine.js"></script><script src="../shared/i18n.js"></script><script src="strings.js"></script><script src="ui.js"></script><script src="demo-plans.js"></script><script src="demo.js"></script><!-- AI demo (temporary) --></body></html>
