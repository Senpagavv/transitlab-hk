<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TransitLab HK · 绿圈比例校验</title><style>
:root{--paper:#f6f4ee;--ink:#18221e;--muted:#6e7973;--line:#d9ded8;--card:rgba(255,255,255,.9);--green:#2f8a62;--green2:#68b48c;--amber:#b1802b;--red:#b84f43;--shadow:0 14px 36px rgba(29,55,42,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}body{background-image:radial-gradient(rgba(37,65,49,.1) 1px,transparent 1px);background-size:12px 12px}
a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:5;display:flex;gap:14px;align-items:center;padding:13px 20px;background:rgba(246,244,238,.86);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{font-family:Georgia,serif;font-size:22px;font-weight:600;letter-spacing:.02em}.brand small{font:10px/1.2 ui-monospace,monospace;letter-spacing:.12em;color:var(--muted);margin-left:8px}.top .sp{flex:1}.static-badge{font:11px ui-monospace,monospace;color:var(--green);border:1px solid #b5d6c4;border-radius:999px;padding:5px 9px;background:#f7fffa;white-space:nowrap}.lang{font:11px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:#fff}.back{font-size:12px;color:var(--green);border:1px solid #b5d6c4;border-radius:999px;padding:6px 11px;background:#f7fffa}.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 44px}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:.16em;color:var(--green);text-transform:uppercase}.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:22px;align-items:end;margin:8px 0 22px}.hero h1{font:600 clamp(32px,5vw,56px)/1.05 Georgia,serif;margin:8px 0 10px;letter-spacing:-.02em}.hero p{max-width:680px;color:var(--muted);font-size:15px;line-height:1.7;margin:0}.hero-note{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow);font-size:13px;line-height:1.6}.hero-note b{display:block;font-size:18px;color:var(--green);margin-bottom:4px}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:18px;align-items:start}.map{position:relative;min-height:440px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(150deg,#fffefa,#edf5ed);overflow:hidden;box-shadow:var(--shadow)}.map:before{content:"";position:absolute;inset:0;background:linear-gradient(140deg,transparent 48%,rgba(67,124,91,.12) 49%,transparent 50%),linear-gradient(25deg,transparent 58%,rgba(67,124,91,.1) 59%,transparent 60%);pointer-events:none}.map svg{position:absolute;inset:0;width:100%;height:100%}.map-caption{position:absolute;top:16px;left:16px;border:1px solid var(--line);background:rgba(255,255,255,.86);padding:8px 11px;border-radius:10px;font-size:12px;color:var(--muted);z-index:1}.node{position:absolute;transform:translate(-50%,-50%);text-align:center;z-index:2}.node .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--green);box-shadow:0 5px 14px rgba(34,94,62,.16);font-weight:700;color:var(--green);margin:auto}.node b{display:block;margin-top:6px;font-size:12px;white-space:nowrap}.node small{display:block;color:var(--muted);font-size:10px;white-space:nowrap}.node.station .dot{border-radius:10px;background:var(--green);color:white;border-color:#216b4a}.node.dest .dot{border-radius:10px;border-color:var(--amber);color:var(--amber);background:#fff9e9}.ring{width:76px;height:76px;display:block;margin:-19px auto -19px}.map .ring{position:relative;inset:auto;width:76px;height:76px}.ring circle{fill:none;stroke-width:4}.ring .track{stroke:#d5ded6}.ring .value{stroke:var(--green);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray .35s ease}.ring-label{position:absolute;top:29px;left:50%;transform:translateX(-50%);font:700 11px ui-monospace,monospace;color:var(--green);white-space:nowrap}.aside{display:grid;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.card h2{font-size:14px;margin:0 0 12px}.card p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:11px 10px;border:1px solid var(--line);border-radius:11px;background:#fff}.stat b{display:block;font:600 25px ui-monospace,monospace;letter-spacing:-.04em}.stat span{font-size:11px;color:var(--muted)}.rows{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;background:#f7faf6;border:1px solid #e0e9e1;font-size:12px}.row strong{font:600 13px ui-monospace,monospace}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}.legend .g{background:var(--green)}.legend .a{background:var(--amber)}.legend .r{background:var(--red)}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.step{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:14px;padding:14px}.step em{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font:700 12px ui-monospace,monospace;font-style:normal}.step h3{font-size:13px;margin:10px 0 4px}.step p{font-size:12px;line-height:1.55;color:var(--muted);margin:0}.footer{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:11px}.pill{display:inline-flex;border:1px solid #b5d6c4;background:#f7fffa;color:var(--green);border-radius:999px;padding:6px 10px;font-size:11px;cursor:pointer}.pill:active{transform:translateY(1px)}
@media(max-width:820px){.hero{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.map{min-height:360px}.flow{grid-template-columns:1fr}.top{padding:11px 14px}.brand{font-size:19px}.brand small{display:none}.wrap{padding:20px 13px 35px}.hero h1{font-size:38px}.hero p{font-size:14px}.hero-note{padding:13px}.footer{flex-direction:column;align-items:flex-start}}
.verify{max-width:760px;margin:0 auto;padding:28px 18px 48px}.verify h1{font:600 42px Georgia,serif;margin:8px 0}.verify p{color:var(--muted);line-height:1.7}.checks{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.check{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;text-align:center;box-shadow:var(--shadow)}.check .ring{width:110px;height:110px;margin:4px auto 2px}.check .ring-label{position:static;display:block;transform:none;font-size:15px}.formula{padding:14px 16px;border:1px dashed #a9c8b3;border-radius:12px;background:#f5fbf6;color:#315e44;font-family:ui-monospace,monospace;font-size:12px;line-height:1.65}@media(max-width:650px){.checks{grid-template-columns:repeat(2,1fr)}.verify h1{font-size:34px}}</style></head><body><header class="top"><a class="brand" href="index.html">TransitLab HK <small>RING CHECK</small></a><span class="sp"></span><a class="back" href="index.html">返回关卡</a></header><main class="verify"><div class="eyebrow">DATA ↔ VISUAL VERIFICATION</div><h1>绿圈和百分比一一对应</h1><p>这是现场备用校验页。环形进度的弧长使用同一个百分比数据源：0% 没有绿色弧线，50% 是半圈，80% 是五分之四圈，100% 才是整圈。</p><div class="checks"><div class="check"><svg class="ring" viewBox="0 0 76 76" data-pct="0"><circle class="track" cx="38" cy="38" r="31"/><circle class="value" cx="38" cy="38" r="31" pathLength="100"/></svg><span class="ring-label">0%</span></div><div class="check"><svg class="ring" viewBox="0 0 76 76" data-pct="50"><circle class="track" cx="38" cy="38" r="31"/><circle class="value" cx="38" cy="38" r="31" pathLength="100"/></svg><span class="ring-label">50%</span></div><div class="check"><svg class="ring" viewBox="0 0 76 76" data-pct="80"><circle class="track" cx="38" cy="38" r="31"/><circle class="value" cx="38" cy="38" r="31" pathLength="100"/></svg><span class="ring-label">80%</span></div><div class="check"><svg class="ring" viewBox="0 0 76 76" data-pct="100"><circle class="track" cx="38" cy="38" r="31"/><circle class="value" cx="38" cy="38" r="31" pathLength="100"/></svg><span class="ring-label">100%</span></div></div><div class="formula">strokeDasharray = 百分比 + (100 − 百分比)<br>示例：50% → 50 50；80% → 80 20；100% → 100 0</div></main><script>document.querySelectorAll('.ring').forEach(function(svg){var p=Math.max(0,Math.min(100,Number(svg.dataset.pct)||0));svg.querySelector('.value').style.strokeDasharray=p+' '+(100-p);});</script></body></html>
